<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8B2500">
<title>LATINA 🦉 Latein lernen</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --terra: #C4622D;
    --terra-dark: #8B2500;
    --terra-light: #E8936A;
    --gold: #D4A017;
    --gold-light: #F2C94C;
    --marble: #F5F0E8;
    --marble-dark: #EDE4D0;
    --deep: #2C1810;
    --green: #4CAF50;
    --red: #E53935;
    --blue: #1565C0;
    --purple: #6A1B9A;
    --shadow: rgba(44,24,16,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--marble);
    color: var(--deep);
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* ── SCREENS ── */
  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--terra-dark);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
  }
  .topbar-title {
    font-family: 'Cinzel', serif;
    color: var(--gold-light);
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .topbar-stat {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.15);
    padding: 5px 10px;
    border-radius: 20px;
    color: white;
    font-weight: 800;
    font-size: 0.9rem;
  }

  /* ── HOME SCREEN ── */
  #home {
    background: linear-gradient(180deg, #8B2500 0%, #C4622D 40%, #F5F0E8 100%);
  }
  .home-header {
    padding: 30px 20px 20px;
    text-align: center;
  }
  .mascot { font-size: 5rem; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .home-title {
    font-family: 'Cinzel', serif;
    color: var(--gold-light);
    font-size: 2.2rem;
    font-weight: 900;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    letter-spacing: 3px;
  }
  .home-subtitle { color: rgba(255,255,255,0.85); font-size: 1rem; margin-top: 5px; }
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 15px 20px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 20px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: white;
    font-weight: 800;
    font-size: 0.95rem;
    backdrop-filter: blur(4px);
  }
  .units-container {
    padding: 10px 16px 80px;
    flex: 1;
  }
  .unit-card {
    background: white;
    border-radius: 20px;
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px var(--shadow);
    border: 3px solid transparent;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .unit-card:active { transform: scale(0.98); }
  .unit-header {
    padding: 16px 18px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .unit-icon { font-size: 2.2rem; }
  .unit-info { flex: 1; }
  .unit-title {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--deep);
  }
  .unit-desc { color: #888; font-size: 0.85rem; margin-top: 2px; }
  .unit-progress-bar {
    height: 8px;
    background: #f0f0f0;
    margin: 0 18px;
    border-radius: 4px;
    overflow: hidden;
  }
  .unit-progress-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--terra), var(--gold));
    transition: width 0.5s ease;
  }
  .lessons-list { padding: 12px 14px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .lesson-btn {
    flex: 1;
    min-width: 80px;
    background: var(--marble-dark);
    border: none;
    border-radius: 14px;
    padding: 10px 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    position: relative;
    font-family: 'Nunito', sans-serif;
  }
  .lesson-btn.completed { background: linear-gradient(135deg, #4CAF50, #2E7D32); color: white; }
  .lesson-btn.active { background: linear-gradient(135deg, var(--terra), var(--terra-dark)); color: white; box-shadow: 0 4px 12px rgba(196,98,45,0.4); }
  .lesson-btn.locked { opacity: 0.45; cursor: not-allowed; }
  .lesson-icon { font-size: 1.5rem; display: block; }
  .lesson-name { font-size: 0.72rem; font-weight: 700; margin-top: 4px; display: block; }
  .checkmark { position: absolute; top: -5px; right: -5px; background: #4CAF50; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: 900; }

  /* ── LESSON INTRO ── */
  #lesson-intro {
    background: linear-gradient(180deg, var(--terra-dark) 0%, var(--terra) 50%, var(--marble) 100%);
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }
  .intro-icon { font-size: 5rem; margin-bottom: 20px; filter: drop-shadow(0 4px 16px rgba(0,0,0,0.3)); }
  .intro-title { font-family: 'Cinzel', serif; color: var(--gold-light); font-size: 1.8rem; font-weight: 900; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .intro-desc { color: rgba(255,255,255,0.9); font-size: 1rem; margin: 12px 0 30px; max-width: 320px; line-height: 1.5; }
  .intro-topics { background: rgba(255,255,255,0.15); border-radius: 16px; padding: 16px; margin-bottom: 30px; width: 100%; max-width: 360px; }
  .intro-topic { color: white; font-size: 0.9rem; padding: 5px 0; font-weight: 600; }
  .btn-primary {
    background: linear-gradient(135deg, var(--gold), #E5A020);
    color: var(--deep);
    border: none;
    border-radius: 16px;
    padding: 16px 48px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(212,160,23,0.4);
    transition: all 0.2s;
    letter-spacing: 1px;
    width: 100%;
    max-width: 320px;
  }
  .btn-primary:active { transform: scale(0.97); }

  /* ── EXERCISE SCREEN ── */
  #exercise {
    background: var(--marble);
    flex-direction: column;
  }
  .ex-progress-bar {
    height: 10px;
    background: var(--marble-dark);
    margin: 0;
    border-radius: 0;
    overflow: hidden;
  }
  .ex-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--terra), var(--gold));
    transition: width 0.4s ease;
  }
  .ex-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: white;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .hearts-display { display: flex; gap: 4px; }
  .heart { font-size: 1.3rem; transition: all 0.3s; }
  .heart.lost { opacity: 0.2; transform: scale(0.8); }
  .ex-counter { color: #888; font-size: 0.85rem; font-weight: 700; }
  .xp-badge { background: var(--gold-light); color: var(--deep); padding: 4px 12px; border-radius: 12px; font-weight: 900; font-size: 0.85rem; }
  .ex-body { flex: 1; padding: 20px 16px; display: flex; flex-direction: column; }
  .ex-instruction { color: #888; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }

  /* Flashcard */
  .flashcard-wrap { perspective: 1000px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .flashcard {
    background: white;
    border-radius: 24px;
    box-shadow: 0 8px 32px var(--shadow);
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.6s;
    transform-style: preserve-3d;
    position: relative;
    border: 3px solid var(--marble-dark);
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .fc-front, .fc-back {
    backface-visibility: hidden;
    width: 100%;
  }
  .fc-back { transform: rotateY(180deg); position: absolute; top: 0; left: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
  .fc-latin { font-family: 'Cinzel', serif; font-size: 2.2rem; font-weight: 700; color: var(--terra-dark); }
  .fc-type { color: #aaa; font-size: 0.8rem; margin-top: 6px; font-style: italic; }
  .fc-german { font-size: 1.8rem; font-weight: 800; color: var(--deep); }
  .fc-example { color: #888; font-size: 0.9rem; margin-top: 10px; font-style: italic; }
  .fc-hint { color: #bbb; font-size: 0.85rem; margin-top: 20px; }
  .fc-flip-btn {
    margin-top: 20px;
    background: var(--marble-dark);
    border: none;
    border-radius: 12px;
    padding: 10px 24px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--deep);
    transition: all 0.2s;
  }
  .fc-flip-btn:active { background: var(--terra-light); }
  .fc-knew-btns { display: flex; gap: 12px; margin-top: 16px; }
  .btn-knew, .btn-didnt {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 16px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-knew { background: var(--green); color: white; }
  .btn-didnt { background: var(--red); color: white; }

  /* Multiple Choice */
  .mc-question {
    background: white;
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 4px 20px var(--shadow);
    margin-bottom: 20px;
    border: 3px solid var(--marble-dark);
  }
  .mc-latin { font-family: 'Cinzel', serif; font-size: 2rem; font-weight: 700; color: var(--terra-dark); }
  .mc-type { color: #bbb; font-size: 0.8rem; margin-top: 4px; font-style: italic; }
  .mc-options { display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .mc-option {
    background: white;
    border: 3px solid var(--marble-dark);
    border-radius: 16px;
    padding: 16px 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    color: var(--deep);
  }
  .mc-option:active { transform: scale(0.98); }
  .mc-option.correct { background: #E8F5E9; border-color: var(--green); color: #1B5E20; }
  .mc-option.wrong { background: #FFEBEE; border-color: var(--red); color: #B71C1C; }
  .mc-option.selected { border-color: var(--terra); background: #FFF3E0; }
  .mc-option.disabled { cursor: not-allowed; }

  /* Matching */
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
  .match-item {
    background: white;
    border: 3px solid var(--marble-dark);
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.95rem;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60px;
  }
  .match-item.latin { font-family: 'Cinzel', serif; color: var(--terra-dark); font-size: 1rem; }
  .match-item.selected { border-color: var(--terra); background: #FFF3E0; box-shadow: 0 0 0 2px var(--terra-light); }
  .match-item.matched { background: #E8F5E9; border-color: var(--green); color: #1B5E20; cursor: default; }
  .match-item.wrong-flash { animation: wrongFlash 0.5s ease; }
  @keyframes wrongFlash { 0%,100%{background:white} 50%{background:#FFEBEE;border-color:var(--red)} }

  /* Fill blank */
  .fill-sentence {
    background: white;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 4px 20px var(--shadow);
    margin-bottom: 20px;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    color: var(--deep);
    line-height: 2;
    border: 3px solid var(--marble-dark);
  }
  .fill-blank {
    display: inline-block;
    border-bottom: 3px solid var(--terra);
    min-width: 100px;
    padding: 0 8px;
    color: var(--terra);
    font-style: italic;
  }
  .fill-options { display: flex; flex-direction: column; gap: 10px; }

  /* ── FEEDBACK OVERLAY ── */
  .feedback-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px 20px 30px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 200;
    border-radius: 24px 24px 0 0;
  }
  .feedback-bar.show { transform: translateY(0); }
  .feedback-bar.correct-fb { background: #E8F5E9; border-top: 4px solid var(--green); }
  .feedback-bar.wrong-fb { background: #FFEBEE; border-top: 4px solid var(--red); }
  .fb-content { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .fb-icon { font-size: 2rem; }
  .fb-title { font-size: 1.1rem; font-weight: 900; }
  .fb-title.correct { color: #1B5E20; }
  .fb-title.wrong { color: #B71C1C; }
  .fb-answer { font-size: 0.9rem; color: #555; margin-top: 3px; }
  .btn-continue {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-continue.correct { background: var(--green); color: white; }
  .btn-continue.wrong { background: var(--red); color: white; }

  /* ── RESULTS SCREEN ── */
  #results {
    background: linear-gradient(180deg, var(--terra-dark) 0%, var(--terra) 60%, var(--marble) 100%);
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    text-align: center;
  }
  .results-icon { font-size: 6rem; margin-bottom: 15px; animation: celebrate 1s ease; }
  @keyframes celebrate { 0%{transform:scale(0) rotate(-180deg)} 80%{transform:scale(1.2)} 100%{transform:scale(1)} }
  .results-title { font-family: 'Cinzel', serif; color: var(--gold-light); font-size: 2rem; font-weight: 900; }
  .results-subtitle { color: rgba(255,255,255,0.85); margin: 8px 0 24px; }
  .results-stats {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 30px;
    width: 100%;
    max-width: 360px;
  }
  .rs-item { text-align: center; }
  .rs-val { font-size: 2rem; font-weight: 900; color: white; }
  .rs-label { font-size: 0.75rem; color: rgba(255,255,255,0.7); margin-top: 3px; }
  .fun-fact {
    background: white;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 24px;
    max-width: 360px;
    text-align: left;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .ff-title { font-size: 0.75rem; font-weight: 900; color: var(--terra); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .ff-text { font-size: 0.9rem; color: var(--deep); line-height: 1.5; }

  /* ── VOCAB SCREEN ── */
  #vocab { background: var(--marble); }
  .vocab-filter {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    background: white;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .vocab-filter-btn {
    white-space: nowrap;
    padding: 7px 14px;
    border: 2px solid var(--marble-dark);
    border-radius: 20px;
    background: none;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--deep);
  }
  .vocab-filter-btn.active { background: var(--terra); border-color: var(--terra); color: white; }
  .vocab-list { padding: 12px 16px 80px; }
  .vocab-item {
    background: white;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 10px var(--shadow);
    border-left: 4px solid var(--terra);
  }
  .vi-latin { font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 700; color: var(--terra-dark); flex: 1; }
  .vi-german { font-size: 1rem; font-weight: 600; color: var(--deep); flex: 1; }
  .vi-type { background: var(--marble-dark); padding: 3px 8px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; color: #888; }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    display: flex;
    box-shadow: 0 -3px 16px var(--shadow);
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 4px 8px;
    background: none;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Nunito', sans-serif;
  }
  .nav-btn.active .nav-icon { transform: scale(1.2); }
  .nav-icon { font-size: 1.5rem; }
  .nav-label { font-size: 0.68rem; font-weight: 700; color: #999; margin-top: 2px; }
  .nav-btn.active .nav-label { color: var(--terra); }

  /* ── GRAMMAR SCREEN ── */
  #grammar { background: var(--marble); }
  .grammar-list { padding: 12px 16px 80px; }
  .grammar-card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px var(--shadow);
    border-top: 5px solid var(--terra);
  }
  .gc-title { font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 700; color: var(--terra-dark); margin-bottom: 10px; }
  .gc-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .gc-table th { background: var(--terra-dark); color: white; padding: 7px 10px; text-align: left; font-family: 'Cinzel', serif; }
  .gc-table td { padding: 7px 10px; border-bottom: 1px solid var(--marble-dark); }
  .gc-table tr:last-child td { border-bottom: none; }
  .gc-table td:first-child { font-weight: 700; color: #888; font-size: 0.8rem; text-transform: uppercase; }
  .gc-table td:nth-child(2) { font-family: 'Cinzel', serif; color: var(--terra-dark); font-weight: 600; }
  .gc-tip { background: #FFF8E1; border-left: 4px solid var(--gold); padding: 10px 14px; border-radius: 0 10px 10px 0; margin-top: 12px; font-size: 0.85rem; color: #555; line-height: 1.5; }

  /* ── ANIMATIONS ── */
  .bounce-in { animation: bounceIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes bounceIn { 0%{transform:scale(0.3);opacity:0} 100%{transform:scale(1);opacity:1} }
  .slide-up { animation: slideUp 0.3s ease; }
  @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
  .xp-pop {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    background: var(--gold-light);
    color: var(--deep);
    font-size: 1.5rem;
    font-weight: 900;
    padding: 12px 24px;
    border-radius: 20px;
    pointer-events: none;
    z-index: 999;
    animation: xpPop 1s ease forwards;
  }
  @keyframes xpPop { 0%{transform:translate(-50%,-50%) scale(0.5);opacity:0} 30%{transform:translate(-50%,-80%) scale(1.2);opacity:1} 70%{transform:translate(-50%,-120%) scale(1);opacity:1} 100%{transform:translate(-50%,-180%) scale(0.8);opacity:0} }
</style>
</head>
<body><script>/* LERNWERK – gemeinsamer Teil aller Seiten (Mathe, Latein, Geschichte, Start, Eltern):
   Name des Kindes, Lernprotokoll je Fach/Thema, Bericht an die Eltern als Link.
   Alles bleibt auf dem Gerät. Der Bericht steckt im #-Teil des Links, und der wird nie an einen Server geschickt. */
(function () {
  'use strict';
  var PROFIL = 'lernwerk_profil';
  var PROTOKOLL = 'lernwerk_protokoll_v1';
  var MAX_VERLAUF = 15; // Runden je Thema im Verlauf
  var MAX_TAGE = 60; // Lerntage
  var MAX_FEHLER = 12; // häufigste Fehler je Thema im Bericht

  function lies(k, leer) { try { return JSON.parse(localStorage.getItem(k)) || leer; } catch (e) { return leer; } }
  function schreib(k, w) { try { localStorage.setItem(k, JSON.stringify(w)); } catch (e) { /* privater Modus */ } }
  function tag(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---------- Profil ----------
  // id unterscheidet zwei Kinder mit gleichem Namen in der Elternansicht
  function profil() {
    var p = lies(PROFIL, {});
    if (!p.id) { p.id = Math.random().toString(36).slice(2, 10); schreib(PROFIL, p); }
    return p;
  }
  function setzeName(name) { var p = profil(); p.name = name; schreib(PROFIL, p); }

  // ---------- Protokoll ----------
  function leeresProtokoll() { return { v: 1, tage: [], faecher: {} }; }

  // Eine Übungsrunde: { fach, fachTitel, thema, titel, richtig, gesamt, geschafft, aufgaben: { schluessel: { l: Bezeichnung, r, f } } }
  function protokolliere(e) {
    var p = lies(PROTOKOLL, leeresProtokoll());
    var heute = tag();
    if (p.tage.indexOf(heute) < 0) p.tage = p.tage.concat(heute).slice(-MAX_TAGE);
    var f = p.faecher[e.fach] = p.faecher[e.fach] || { ti: e.fachTitel, th: {} };
    var t = f.th[e.thema] = f.th[e.thema] || { n: 0, ok: 0, r: 0, g: 0, h: [], a: {} };
    t.ti = e.titel; t.n++; t.z = heute;
    if (e.geschafft) t.ok++;
    t.r += e.richtig; t.g += e.gesamt;
    t.h = t.h.concat([[heute, e.richtig, e.gesamt, e.geschafft ? 1 : 0]]).slice(-MAX_VERLAUF);
    Object.keys(e.aufgaben || {}).forEach(function (k) {
      var a = e.aufgaben[k], alt = t.a[k] || [a.l, 0, 0];
      t.a[k] = [a.l, alt[1] + a.r, alt[2] + a.f];
    });
    schreib(PROTOKOLL, p);
  }

  // Stände der Apps von vor dem Protokoll, damit auch der erste Bericht etwas zeigt
  function staende() {
    var m = lies('lernwerk_v1', null), la = lies('latina_state', null), ge = lies('geschichte_lernapp_progress_v1', null);
    var s = {};
    if (m && m.themen) {
      s.mathematik = {};
      Object.keys(m.themen).forEach(function (k) { s.mathematik[k.split('/').pop()] = [m.themen[k].lektionen, m.themen[k].sterne]; });
    }
    if (la) s.latein = { xp: la.xp || 0, fertig: (la.completedLessons || []).length };
    if (ge) {
      s.geschichte = {};
      Object.keys(ge).forEach(function (k) { s.geschichte[k] = [ge[k].bestScore, ge[k].total]; });
    }
    return s;
  }

  function bericht() {
    var pr = profil(), p = lies(PROTOKOLL, leeresProtokoll());
    var faecher = {};
    Object.keys(p.faecher).forEach(function (fid) {
      var f = p.faecher[fid], th = {};
      Object.keys(f.th).forEach(function (tid) {
        var t = f.th[tid];
        // nur Fehlerschwerpunkte mitschicken, das hält den Link kurz
        var fehler = Object.keys(t.a).map(function (k) { return t.a[k]; })
          .filter(function (a) { return a[2] > 0; })
          .sort(function (x, y) { return y[2] - x[2] || y[2] / (y[1] + y[2]) - x[2] / (x[1] + x[2]); })
          .slice(0, MAX_FEHLER);
        th[tid] = { ti: t.ti, n: t.n, ok: t.ok, r: t.r, g: t.g, z: t.z, h: t.h, a: fehler };
      });
      faecher[fid] = { ti: f.ti, th: th };
    });
    return { v: 1, n: pr.name || 'Ohne Namen', i: pr.id, t: Date.now(), tage: p.tage, f: faecher, s: staende() };
  }

  // ---------- Link kodieren (deflate + base64url) ----------
  function b64url(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).split('+').join('-').split('/').join('_').split('=').join('');
  }
  function vonB64url(s) {
    s = s.split('-').join('+').split('_').join('/');
    while (s.length % 4) s += '=';
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function strom(bytes, umwandler) {
    return new Response(new Blob([bytes]).stream().pipeThrough(umwandler)).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  function packen(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream === 'undefined') return Promise.resolve('j' + b64url(bytes));
    return strom(bytes, new CompressionStream('deflate-raw')).then(function (b) { return 'z' + b64url(b); });
  }
  function auspacken(code) {
    var art = code.charAt(0), bytes = vonB64url(code.slice(1));
    var fertig = art === 'z' ? strom(bytes, new DecompressionStream('deflate-raw')) : Promise.resolve(bytes);
    return fertig.then(function (b) { return JSON.parse(new TextDecoder().decode(b)); });
  }

  // ---------- Oberfläche ----------
  var CSS = '.lw-schleier{position:fixed;inset:0;z-index:80;background:rgba(0,20,26,.82);display:flex;align-items:center;justify-content:center;padding:16px}' +
    '.lw-dialog{width:100%;max-width:420px;max-height:calc(100vh - 32px);overflow-y:auto;background:#002B36;color:#F5F0E6;border:1px solid #C9A84C;border-radius:18px;padding:24px 20px;font:16px/1.45 Inter,system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.5)}' +
    '.lw-dialog h2{margin:0 0 6px;font:700 22px/1.25 Montserrat,Inter,system-ui,sans-serif;color:#E8C97D}' +
    '.lw-dialog p{margin:0 0 14px;color:#C9D4D6}' +
    '.lw-dialog input,.lw-dialog textarea{width:100%;box-sizing:border-box;min-height:52px;padding:12px 14px;border-radius:12px;border:1px solid rgba(200,168,76,.5);background:#00202A;color:#F5F0E6;font:inherit;font-size:18px}' +
    '.lw-dialog textarea{font-size:13px;min-height:90px;word-break:break-all}' +
    '.lw-knopf{display:flex;width:100%;align-items:center;justify-content:center;min-height:52px;margin-top:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#B8922A,#E8C97D);color:#000;font:700 16px Inter,system-ui,sans-serif;cursor:pointer}' +
    '.lw-knopf.leise{background:transparent;color:#E8C97D;border:1px solid rgba(200,168,76,.4)}';
  function stil() {
    if (document.getElementById('lw-stil')) return;
    var s = document.createElement('style'); s.id = 'lw-stil'; s.textContent = CSS; document.head.appendChild(s);
  }
  function dialog(html) {
    stil();
    var d = document.createElement('div');
    d.className = 'lw-schleier';
    d.innerHTML = '<div class="lw-dialog" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(d);
    return d;
  }

  // Beim ersten Start: „Wie heißt du?“ (der Name bleibt auf dem Gerät und steht nur im Bericht)
  function frageName(fertig) {
    var alt = profil().name || '';
    var d = dialog('<form><h2>' + (alt ? 'Name ändern' : 'Hallo! Wie heißt du?') + '</h2><p>Dein Name steht auf dem Bericht für deine Eltern. Er bleibt auf diesem Handy.</p>' +
      '<input id="lw-name" maxlength="30" autocomplete="given-name" placeholder="Dein Vorname" value="' + esc(alt) + '" required><button class="lw-knopf" type="submit">Los geht’s!</button></form>');
    var feld = d.querySelector('#lw-name');
    feld.focus();
    d.querySelector('form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var name = feld.value.trim();
      if (!name) return;
      setzeName(name);
      d.remove();
      if (fertig) fertig(name);
    });
  }

  // prefix: Weg von der aktuellen Seite zur Wurzel der App, z. B. '../'
  function berichtLink(prefix) {
    return packen(bericht()).then(function (code) { return new URL((prefix || '') + 'eltern/', location.href).href + '#b=' + code; });
  }
  function senden(prefix) {
    var name = profil().name;
    if (!name) return frageName(function () { senden(prefix); });
    return berichtLink(prefix).then(function (url) {
      var titel = 'LERNWERK-Bericht von ' + name;
      if (navigator.share) return navigator.share({ title: titel, text: titel + ' – zum Öffnen tippen:', url: url }).catch(function () {});
      // ohne Teilen-Menü (z. B. am PC): Link zum Kopieren zeigen
      var d = dialog('<h2>Bericht an deine Eltern</h2><p>Kopiere diesen Link und schick ihn deinen Eltern.</p><textarea id="lw-link" readonly>' + esc(url) + '</textarea>' +
        '<button class="lw-knopf" id="lw-kopieren">Link kopieren</button><button class="lw-knopf leise" id="lw-zu">Schließen</button>');
      var feld = d.querySelector('#lw-link');
      d.querySelector('#lw-kopieren').onclick = function () {
        feld.select();
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).catch(function () { document.execCommand('copy'); });
        this.textContent = '✓ Kopiert';
      };
      d.querySelector('#lw-zu').onclick = function () { d.remove(); };
    });
  }

  // Auf Kinder-Seiten: beim ersten Besuch nach dem Namen fragen, danach (oder sofort) fertig()
  function start(fertig) {
    function los() { if (profil().name) { if (fertig) fertig(); } else frageName(fertig); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', los);
    else los();
  }

  window.LERNWERK = {
    profil: profil, setzeName: setzeName, frageName: frageName, start: start, dialog: dialog,
    protokolliere: protokolliere, bericht: bericht, berichtLink: berichtLink, senden: senden,
    packen: packen, auspacken: auspacken, tag: tag, esc: esc,
  };
})();
</script>

let state = {
  xp: 0,
  streak: 0,
  lastDate: null,
  completedLessons: [],
};

let currentLesson = null;
let exercises = [];

let hearts = 3;
let xpGained = 0;
let correctCount = 0;
let feedbackShowing = false;
let matchSelected = null;
let matchCorrect = 0;
let matchTotal = 0;

function loadState() {
  try {
    const s = localStorage.getItem('latina_state');
    if (s) state = { ...state, ...JSON.parse(s) };
    // streak logic
    const today = new Date().toDateString();
    if (state.lastDate !== today) {
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      if (state.lastDate !== yesterday) state.streak = 0;
    }
  } catch(e) {}
}
function saveState() {
  try { localStorage.setItem('latina_state', JSON.stringify(state)); } catch(e) {}
}

// ═══════════════════ LERNPROTOKOLL (LERNWERK) ═══════════════════
// Meldet jede Lektion an das gemeinsame Lernprotokoll (Bericht an die Eltern), je Einheit und Vokabel.
// Ohne LERNWERK (Datei einzeln geöffnet) passiert nichts.
let lwFalsch = new Set();
function lwFalschMerken() {
  const ex = exercises[currentExIdx];
  if (ex && ex.vocab) lwFalsch.add(ex.vocab.id);
}
function lwProtokoll(geschafft) {
  if (!window.LERNWERK || !currentLesson) return;
  const { lesson, unit } = currentLesson;
  // beim Scheitern ist currentExIdx schon auf die nächste (unbeantwortete) Übung gerückt
  const bis = geschafft ? exercises.length : Math.min(Math.max(currentExIdx, 1), exercises.length);
  const aufgaben = {};
  exercises.slice(0, bis).forEach(ex => {
    if (!ex.vocab) return;
    const v = ex.vocab;
    const a = aufgaben[v.id] = aufgaben[v.id] || { l: v.lat + ' – ' + v.ger, r: 0, f: 0 };
    if (lwFalsch.has(v.id)) a.f++; else a.r++;
  });
  LERNWERK.protokolliere({ fach: 'latein', fachTitel: 'Latein', thema: 'e' + unit.id, titel: unit.title, richtig: Math.min(correctCount, bis), gesamt: bis, geschafft, aufgaben });
}

// ═══════════════════ SCREENS ═══════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'home') renderHome();
  if (id === 'vocab') renderVocab();
  if (id === 'grammar') renderGrammar();
}

// ═══════════════════ HOME ═══════════════════
function renderHome() {
  document.getElementById('streak-home').textContent = state.streak;
  document.getElementById('xp-home').textContent = state.xp;
  document.getElementById('lessons-done').textContent = state.completedLessons.length;

  const container = document.getElementById('units-container');
  container.innerHTML = '';

  UNITS.forEach(unit => {
    const allLessons = unit.lessons;
    const doneLessons = allLessons.filter(l => state.completedLessons.includes(l.id));
    const progress = Math.round((doneLessons.length / allLessons.length) * 100);

    const card = document.createElement('div');
    card.className = 'unit-card';

    let lessonsHtml = allLessons.map((l, i) => {
      const done = state.completedLessons.includes(l.id);
      const prevDone = i === 0 || state.completedLessons.includes(allLessons[i-1].id);
      const active = !done && prevDone;
      const locked = !done && !prevDone;
      const cls = done ? 'completed' : active ? 'active' : 'locked';
      const check = done ? '<div class="checkmark">✓</div>' : '';
      return `<button class="lesson-btn ${cls}" ${locked ? 'disabled' : ''} onclick="openLesson(${unit.id}, '${l.id}')">
        ${check}
        <span class="lesson-icon">${l.icon}</span>
        <span class="lesson-name">${l.name}</span>
      </button>`;
    }).join('');

    card.innerHTML = `
      <div class="unit-header" style="background: linear-gradient(135deg, ${unit.color}22, ${unit.color}11);">
        <div class="unit-icon">${unit.icon}</div>
        <div class="unit-info">
          <div class="unit-title" style="color:${unit.color}">${unit.title}</div>
          <div class="unit-desc">${unit.desc.substring(0,50)}...</div>
        </div>
      </div>
      <div class="unit-progress-bar"><div class="unit-progress-fill" style="width:${progress}%; background: linear-gradient(90deg, ${unit.color}, ${unit.color}88)"></div></div>
      <div class="lessons-list">${lessonsHtml}</div>
    `;
    container.appendChild(card);
  });
}

// ═══════════════════ LESSON OPEN ═══════════════════
function openLesson(unitId, lessonId) {
  const unit = UNITS.find(u => u.id === unitId);
  const lesson = unit.lessons.find(l => l.id === lessonId);
  if (!lesson) return;
  currentLesson = { unit, lesson };

  document.getElementById('intro-icon').textContent = unit.icon;
  document.getElementById('intro-title').textContent = `${unit.title} — ${lesson.name}`;
  document.getElementById('intro-desc').textContent = unit.desc;
  const topicsHtml = unit.topics.map(t => `<div class="intro-topic">✦ ${t}</div>`).join('');
  document.getElementById('intro-topics').innerHTML = topicsHtml;

  showScreen('lesson-intro');
}

// ═══════════════════ BUILD EXERCISES ═══════════════════
function startExercises() {
  const { lesson } = currentLesson;
  const vocabs = lesson.vocabIds.map(id => VOCAB.find(v => v.id === id)).filter(Boolean);

  hearts = 3;
  xpGained = 0;
  correctCount = 0;
  currentExIdx = 0;
  lwFalsch = new Set();
  feedbackShowing = false;

  if (lesson.type === 'flashcard') {
    exercises = vocabs.map(v => ({ type: 'flashcard', vocab: v }));
  } else if (lesson.type === 'multiple_choice') {
    exercises = vocabs.map(v => buildMC(v, vocabs));
    shuffle(exercises);
    exercises = exercises.slice(0, 8);
  } else if (lesson.type === 'matching') {
    exercises = [{ type: 'matching', vocabs: vocabs.slice(0,5) }];
  } else if (lesson.type === 'fill_blank') {
    exercises = vocabs.map(v => buildFill(v));
  }

  showScreen('exercise');
  renderExercise();
}

function buildMC(vocab, allVocabs) {
  // Either lat→ger or ger→lat
  const isLatToGer = Math.random() > 0.4;
  const distractors = allVocabs.filter(v => v.id !== vocab.id);
  shuffle(distractors);
  const options = [vocab, ...distractors.slice(0,3)];
  shuffle(options);
  return {
    type: 'multiple_choice',
    question: isLatToGer ? vocab.lat : vocab.ger,
    questionType: isLatToGer ? vocab.type : 'Latein',
    answer: isLatToGer ? vocab.ger : vocab.lat,
    options: options.map(o => ({ text: isLatToGer ? o.ger : o.lat, correct: o.id === vocab.id })),
    vocab
  };
}

function buildFill(vocab) {
  // Simple: show German, fill Latin
  return {
    type: 'fill_blank',
    sentence: `___ bedeutet: "${vocab.ger}"`,
    answer: vocab.lat,
    vocab,
    options: shuffled4(vocab, VOCAB.filter(v => v.unit === vocab.unit)).map(v => v.lat)
  };
}

function shuffled4(correct, pool) {
  const others = pool.filter(v => v.id !== correct.id);
  shuffle(others);
  const four = [correct, ...others.slice(0,3)];
  shuffle(four);
  return four;
}

// ═══════════════════ RENDER EXERCISE ═══════════════════
function renderExercise() {
  updateExHeader();
  const ex = exercises[currentExIdx];
  if (!ex) { finishLesson(); return; }

  const body = document.getElementById('ex-body');
  body.innerHTML = '';

  if (ex.type === 'flashcard') renderFlashcard(ex, body);
  else if (ex.type === 'multiple_choice') renderMC(ex, body);
  else if (ex.type === 'matching') renderMatching(ex, body);
  else if (ex.type === 'fill_blank') renderFill(ex, body);
}

function updateExHeader() {
  const total = exercises.length;
  const pct = Math.round((currentExIdx / total) * 100);
  document.getElementById('ex-progress').style.width = pct + '%';
  document.getElementById('ex-counter').textContent = `${currentExIdx + 1} / ${total}`;
  document.getElementById('xp-gain').textContent = xpGained;
  const heartsHtml = [0,1,2].map(i => `<span class="heart${i >= hearts ? ' lost' : ''}">❤️</span>`).join('');
  document.getElementById('hearts-display').innerHTML = heartsHtml;
}

function renderFlashcard(ex, body) {
  const v = ex.vocab;
  body.innerHTML = `
    <div class="ex-instruction">Lerne diese Vokabel</div>
    <div class="flashcard-wrap">
      <div class="flashcard" id="fc" onclick="flipCard()">
        <div class="fc-front">
          <div class="fc-latin">${v.lat}</div>
          <div class="fc-type">${v.type} ${v.gen}</div>
          <div class="fc-hint" style="margin-top:24px">Tippe zum Umdrehen 👆</div>
        </div>
        <div class="fc-back">
          <div class="fc-german">${v.ger}</div>
          <div class="fc-example">${v.example || ''}</div>
        </div>
      </div>
    </div>
    <div id="fc-buttons" style="display:none; padding:0 4px">
      <div class="fc-knew-btns">
        <button class="btn-didnt" onclick="cardAnswer(false)">😕 Noch nicht</button>
        <button class="btn-knew" onclick="cardAnswer(true)">😊 Gewusst!</button>
      </div>
    </div>
  `;
}
function flipCard() {
  const fc = document.getElementById('fc');
  fc.classList.toggle('flipped');
  document.getElementById('fc-buttons').style.display = 'block';
  fc.onclick = null;
}
function cardAnswer(knew) {
  if (knew) { xpGained += 5; correctCount++; } else lwFalschMerken();
  currentExIdx++;
  renderExercise();
}

function renderMC(ex, body) {
  const optHtml = ex.options.map((o,i) =>
    `<button class="mc-option" id="opt${i}" onclick="selectMC(${i})">${o.text}</button>`
  ).join('');
  body.innerHTML = `
    <div class="ex-instruction">${ex.questionType === 'Latein' ? 'Was bedeutet auf Latein?' : 'Was bedeutet das?'}</div>
    <div class="mc-question">
      <div class="mc-latin">${ex.question}</div>
      <div class="mc-type">${ex.questionType}</div>
    </div>
    <div class="mc-options">${optHtml}</div>
  `;
}
function selectMC(idx) {
  if (feedbackShowing) return;
  const ex = exercises[currentExIdx];
  const opt = ex.options[idx];
  const btn = document.getElementById('opt' + idx);
  document.querySelectorAll('.mc-option').forEach(b => b.classList.add('disabled'));

  if (opt.correct) {
    btn.classList.add('correct');
    xpGained += 10;
    correctCount++;
    showFeedback(true, 'Richtig! 🎉', `${ex.vocab.lat} = ${ex.vocab.ger}`);
  } else {
    btn.classList.add('wrong');
    const correctBtn = document.getElementById('opt' + ex.options.findIndex(o => o.correct));
    if (correctBtn) correctBtn.classList.add('correct');
    loseHeart();
    showFeedback(false, 'Nicht ganz...', `Richtig wäre: ${ex.options.find(o=>o.correct).text}`);
  }
}

function renderMatching(ex, body) {
  const vocabs = ex.vocabs;
  matchCorrect = 0;
  matchTotal = vocabs.length;
  matchSelected = null;

  const latins = vocabs.map(v => ({id:v.id, text:v.lat, side:'lat'}));
  const germans = vocabs.map(v => ({id:v.id, text:v.ger, side:'ger'}));
  shuffle(latins); shuffle(germans);
  const pairs = [];
  for (let i = 0; i < vocabs.length; i++) {
    pairs.push(latins[i], germans[i]);
  }
  // display as 2-col grid alternating
  const leftCol = latins;
  const rightCol = germans;

  let html = `<div class="ex-instruction">Ordne die Paare zu!</div><div class="match-grid">`;
  for (let i = 0; i < vocabs.length; i++) {
    html += `<div class="match-item latin" id="ml${latins[i].id}" data-id="${latins[i].id}" data-side="lat" onclick="selectMatch(this)">${latins[i].text}</div>`;
    html += `<div class="match-item" id="mg${germans[i].id}" data-id="${germans[i].id}" data-side="ger" onclick="selectMatch(this)">${germans[i].text}</div>`;
  }
  html += '</div>';
  body.innerHTML = html;
}

function selectMatch(el) {
  if (el.classList.contains('matched')) return;
  if (!matchSelected) {
    document.querySelectorAll('.match-item.selected').forEach(e => e.classList.remove('selected'));
    matchSelected = el;
    el.classList.add('selected');
  } else {
    if (matchSelected === el) { el.classList.remove('selected'); matchSelected = null; return; }
    if (matchSelected.dataset.id === el.dataset.id && matchSelected.dataset.side !== el.dataset.side) {
      // Correct!
      matchSelected.classList.remove('selected');
      matchSelected.classList.add('matched');
      el.classList.add('matched');
      matchSelected = null;
      matchCorrect++;
      xpGained += 8;
      correctCount++;
      if (matchCorrect === matchTotal) {
        setTimeout(() => { showFeedback(true, 'Alle Paare gefunden! 🎉', 'Klasse gemacht!'); }, 300);
      }
    } else {
      el.classList.add('wrong-flash');
      matchSelected.classList.add('wrong-flash');
      setTimeout(() => {
        el.classList.remove('wrong-flash','selected');
        matchSelected.classList.remove('wrong-flash','selected');
        matchSelected = null;
        loseHeart();
      }, 500);
    }
  }
}

function renderFill(ex, body) {
  const optHtml = ex.options.map((o,i) =>
    `<button class="mc-option" id="fopt${i}" onclick="selectFill(${i})">${o}</button>`
  ).join('');
  body.innerHTML = `
    <div class="ex-instruction">Wähle das richtige lateinische Wort!</div>
    <div class="fill-sentence">${ex.sentence.replace('___', '<span class="fill-blank">???</span>')}</div>
    <div class="fill-options">${optHtml}</div>
  `;
}
function selectFill(idx) {
  if (feedbackShowing) return;
  const ex = exercises[currentExIdx];
  const chosen = ex.options[idx];
  const btn = document.getElementById('fopt' + idx);
  document.querySelectorAll('.mc-option').forEach(b => b.classList.add('disabled'));

  if (chosen === ex.answer) {
    btn.classList.add('correct');
    xpGained += 10;
    correctCount++;
    showFeedback(true, 'Richtig! ✅', `${ex.answer} = ${ex.vocab.ger}`);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.mc-option').forEach((b,i) => { if(ex.options[i]===ex.answer) b.classList.add('correct'); });
    loseHeart();
    showFeedback(false, 'Fast!', `Richtig: ${ex.answer}`);
  }
}

// ═══════════════════ FEEDBACK ═══════════════════
function showFeedback(correct, title, answer) {
  feedbackShowing = true;
  const bar = document.getElementById('feedback-bar');
  const icon = document.getElementById('fb-icon');
  const ttl = document.getElementById('fb-title');
  const ans = document.getElementById('fb-answer');
  const btn = document.getElementById('btn-continue');

  bar.className = 'feedback-bar show ' + (correct ? 'correct-fb' : 'wrong-fb');
  icon.textContent = correct ? '🎉' : '😬';
  ttl.className = 'fb-title ' + (correct ? 'correct' : 'wrong');
  ttl.textContent = title;
  ans.textContent = answer;
  btn.className = 'btn-continue ' + (correct ? 'correct' : 'wrong');
  btn.textContent = correct ? 'Weiter →' : 'Weiter →';

  if (correct) popXP();
}

function popXP() {
  const el = document.createElement('div');
  el.className = 'xp-pop';
  el.textContent = '+10 ⭐';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

function nextExercise() {
  feedbackShowing = false;
  document.getElementById('feedback-bar').className = 'feedback-bar';
  const ex = exercises[currentExIdx];
  if (ex && ex.type !== 'matching') currentExIdx++;
  else if (ex && ex.type === 'matching' && matchCorrect === matchTotal) currentExIdx++;
  if (hearts <= 0) { failLesson(); return; }
  renderExercise();
}

function loseHeart() {
  lwFalschMerken();
  hearts = Math.max(0, hearts - 1);
  updateExHeader();
}

// ═══════════════════ FINISH / FAIL ═══════════════════
function finishLesson() {
  const { lesson, unit } = currentLesson;
  if (!state.completedLessons.includes(lesson.id)) {
    state.completedLessons.push(lesson.id);
  }
  state.xp += xpGained;
  const today = new Date().toDateString();
  if (state.lastDate !== today) {
    state.streak++;
    state.lastDate = today;
  }
  saveState();
  lwProtokoll(true);

  const emoji = correctCount >= exercises.length * 0.8 ? '🏆' : correctCount >= exercises.length * 0.5 ? '⭐' : '💪';
  const title = correctCount >= exercises.length * 0.8 ? 'Ausgezeichnet!' : 'Gut gemacht!';
  document.getElementById('results-icon').textContent = emoji;
  document.getElementById('results-title').textContent = title;
  document.getElementById('results-subtitle').textContent = `${unit.title} — ${lesson.name} abgeschlossen!`;
  document.getElementById('rs-xp').textContent = xpGained;
  document.getElementById('rs-correct').textContent = `${correctCount}/${exercises.length}`;
  document.getElementById('rs-hearts').textContent = hearts;

  const ff = FUN_FACTS[Math.floor(Math.random() * FUN_FACTS.length)];
  document.getElementById('fun-fact').innerHTML = `<div class="ff-title">${ff.icon} Wusstest du schon?</div><div class="ff-text">${ff.text}</div>`;

  showScreen('results');
}

function failLesson() {
  lwProtokoll(false);
  showFeedback(false, 'Keine Herzen mehr! 😢', 'Versuche es noch einmal — du schaffst das!');
  document.getElementById('btn-continue').onclick = () => backToHome();
  document.getElementById('btn-continue').textContent = 'Nochmal versuchen 💪';
}

function backToHome() {
  document.getElementById('feedback-bar').className = 'feedback-bar';
  showScreen('home');
}

// ═══════════════════ VOCAB SCREEN ═══════════════════
let vocabFilter = 0;
function renderVocab() {
  document.getElementById('xp-vocab').textContent = state.xp;
  const filterDiv = document.getElementById('vocab-filter');
  const allBtn = `<button class="vocab-filter-btn ${vocabFilter===0?'active':''}" onclick="setVocabFilter(0)">Alle</button>`;
  const unitBtns = UNITS.map(u => `<button class="vocab-filter-btn ${vocabFilter===u.id?'active':''}" onclick="setVocabFilter(${u.id})">${u.icon} ${u.title}</button>`).join('');
  filterDiv.innerHTML = allBtn + unitBtns;

  const list = document.getElementById('vocab-list');
  const filtered = vocabFilter === 0 ? VOCAB : VOCAB.filter(v => v.unit === vocabFilter);
  list.innerHTML = filtered.map(v => `
    <div class="vocab-item">
      <div class="vi-latin">${v.lat}</div>
      <div class="vi-german">${v.ger}</div>
      <div class="vi-type">${v.type}</div>
    </div>
  `).join('');
}
function setVocabFilter(id) { vocabFilter = id; renderVocab(); }

// ═══════════════════ GRAMMAR SCREEN ═══════════════════
function renderGrammar() {
  document.getElementById('xp-gram').textContent = state.xp;
  const list = document.getElementById('grammar-list');
  list.innerHTML = GRAMMAR_CARDS.map(g => {
    const thead = `<tr>${g.table[0].map(h=>`<th>${h}</th>`).join('')}</tr>`;
    const tbody = g.table.slice(1).map(row => `<tr>${row.map((cell,i)=>`<td>${cell}</td>`).join('')}</tr>`).join('');
    return `
      <div class="grammar-card slide-up">
        <div class="gc-title">${g.title}</div>
        <table class="gc-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>
        <div class="gc-tip">${g.tip}</div>
      </div>
    `;
  }).join('');
}

// ═══════════════════ UTILS ═══════════════════
function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ═══════════════════ INIT ═══════════════════
loadState();
renderHome();
</script>

.update-banner{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;max-width:456px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:52px;border:1px solid #C9A84C;border-radius:14px;background:#002B36;color:#F5F0E6;font:600 15px/1.3 Inter,system-ui,sans-serif;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:pointer;animation:ub-rein .25s ease-out}
.update-banner[hidden]{display:none}.update-banner:disabled{opacity:.7}
.update-banner .ub-text{flex:1;min-width:0}
.update-banner .ub-aktion{flex-shrink:0;padding:6px 12px;border-radius:999px;background:linear-gradient(135deg,#B8922A,#E8C97D);color:#000;font-weight:700}
@keyframes ub-rein{from{transform:translateY(140%);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.update-banner{animation:none}}
</style>
<button id="update-banner" class="update-banner" type="button" hidden><span aria-hidden="true">⬆️</span><span class="ub-text">Neue Inhalte verfügbar</span><span class="ub-aktion">Aktualisieren</span></button>
<script>
(function () {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  var banner = document.getElementById('update-banner');
  function zeigen() { banner.hidden = false; }
  // erst neu laden, wenn die neue Version übernommen hat – ein Neuladen mitten im Wechsel kann hängen bleiben
  var neuLaden = function () { neuLaden = function () {}; location.reload(); };
  banner.addEventListener('click', function () {
    banner.disabled = true;
    banner.querySelector('.ub-aktion').textContent = '…';
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg || !reg.waiting) return neuLaden();
      navigator.serviceWorker.addEventListener('controllerchange', function () { neuLaden(); });
      setTimeout(function () { neuLaden(); }, 3000);
      reg.waiting.postMessage('SKIP_WAITING');
    }).catch(function () { neuLaden(); });
  });
  navigator.serviceWorker.register('../sw.js', { scope: '../' }).then(function (reg) {
    // beim allerersten Besuch (noch kein Controller) gibt es nichts zu aktualisieren
    var hatteController = !!navigator.serviceWorker.controller;
    if (reg.waiting && hatteController) zeigen();
    reg.addEventListener('updatefound', function () {
      var neu = reg.installing;
      if (neu) neu.addEventListener('statechange', function () { if (neu.state === 'installed' && hatteController) zeigen(); });
    });
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (hatteController) zeigen(); });
    reg.update().catch(function () {});
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
    // Startseite: Version anzeigen und von Hand nach Updates suchen
    var v = document.getElementById('version');
    if (!v) return;
    var text = v.querySelector('span'), knopf = v.querySelector('button');
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data && e.data.version) text.textContent = 'Version ' + String(e.data.version).replace('lernwerk-', '').slice(0, 7);
    });
    if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('VERSION');
    knopf.hidden = false;
    knopf.addEventListener('click', function () {
      knopf.disabled = true; knopf.textContent = 'Suche …';
      reg.update().then(function () {
        var laedt = reg.installing || reg.waiting;
        if (reg.waiting) zeigen();
        knopf.textContent = laedt ? (reg.waiting ? 'Update bereit – unten tippen' : 'Update wird geladen …') : '✓ Neueste Version';
        if (reg.installing) reg.installing.addEventListener('statechange', function () { if (reg.waiting) knopf.textContent = 'Update bereit – unten tippen'; });
      }).catch(function () { knopf.textContent = 'Kein Internet – später noch mal'; })
        .then(function () { setTimeout(function () { knopf.disabled = false; }, 1500); });
    });
  }).catch(function () {});
})();
</script></body>
