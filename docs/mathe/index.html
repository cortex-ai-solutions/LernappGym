<style>@font-face{font-family:'Montserrat';font-weight:400;font-display:swap;src:url(../fonts/montserrat-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:600;font-display:swap;src:url(../fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:700;font-display:swap;src:url(../fonts/montserrat-latin-700-normal.woff2) format('woff2')}

@font-face{font-family:'Inter';font-weight:500;font-display:swap;src:url(../fonts/inter-latin-500-normal.woff2) format('woff2')}

/* LERNWERK Webapp – Cortex-CI (design.md im Hub), kindgerecht: große Schrift, Tippflächen ≥ 48 px */
:root {
  --bg-deep: #002B36; --bg-primary: #00343F; --bg-mid: #004D5C; --bg-light: #0A6070; --bg-black: #001820;
  --gold-dark: #8B6914; --gold-mid: #B8922A; --gold-base: #C9A84C; --gold-warm: #D4AF6A; --gold-light: #E8C97D; --gold-bright: #F0D9A0;
  --text: #F5F0E8; --text-gold: #E8C97D; --text-secondary: #A89060; --text-muted: #8A9A9A;
  --ok: #2D9E6B; --ok-hell: #3ECF8E; --fehler: #B84040; --fehler-hell: #E07070;
  --border: rgba(200, 168, 76, 0.2); --border-strong: rgba(200, 168, 76, 0.5);
  --gradient-gold: linear-gradient(135deg, #8B6914 0%, #C9A84C 45%, #E8C97D 100%);
  --card: linear-gradient(135deg, #003B49 0%, #002530 100%);
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; }
html, body { min-height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif; font-size: 17px; line-height: 1.5; color: var(--text);
  background: radial-gradient(ellipse at top left, var(--bg-mid) 0%, var(--bg-deep) 50%, var(--bg-black) 100%) fixed;
  -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, .btn, .chip, .titel { font-family: 'Montserrat', 'Inter', sans-serif; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
.gold { background: linear-gradient(90deg, #B8922A, #E8C97D, #C9A84C); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
:focus-visible { outline: 3px solid var(--gold-light); outline-offset: 2px; }

/* Kopf */
.kopf { display: flex; align-items: center; gap: 10px; margin: 4px 0 18px; }
.kopf h1 { min-width: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.03em; flex: 1; }
.zurueck { display: inline-flex; align-items: center; justify-content: center; min-width: 48px; min-height: 48px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--gold-base); text-decoration: none; font-size: 22px; }
.chips { display: flex; gap: 8px; }
.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 12px; border-radius: 20px; font-size: 14px; font-weight: 700; color: var(--gold-light); background: rgba(201, 168, 76, 0.12); border: 1px solid rgba(201, 168, 76, 0.3); }

/* Themenkarten */
.thema { position: relative; overflow: hidden; padding: 16px; margin-bottom: 14px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(200, 168, 76, 0.1); }
.thema::after { content: ''; position: absolute; right: 0; bottom: 0; width: 140px; height: 50px; background: var(--gradient-gold); border-radius: 60% 0 0 0; opacity: 0.08; pointer-events: none; }
.thema-kopf { display: flex; align-items: center; gap: 14px; }
.thema-icon { font-size: 38px; line-height: 1; }
.thema h2 { font-size: 18px; font-weight: 700; color: var(--gold-light); line-height: 1.3; }
.thema .meta { font-size: 14px; color: var(--text-muted); }
.sterne { color: var(--gold-base); letter-spacing: 2px; }
.reihe { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; position: relative; z-index: 1; }
.reihe .btn { flex: 1 1 auto; }
.reihe-druck { display: flex; gap: 8px; margin-top: 8px; position: relative; z-index: 1; }
.reihe-druck .btn { flex: 1; font-size: 14px; padding: 0 8px; white-space: nowrap; }
.reihe-druck .btn[aria-expanded="true"] { background: rgba(200, 168, 76, 0.18); border-color: var(--gold-light); }
.reihe-druck .btn[aria-expanded="true"] span { display: inline-block; transform: rotate(180deg); }
.druck-liste { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; padding: 8px; border-radius: 12px; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border); position: relative; z-index: 1; }
.druck-liste[hidden] { display: none; }
.druck-liste .btn { font-size: 15px; padding: 0 8px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-size: 16px; font-weight: 700; text-decoration: none; transition: transform 0.08s, background 0.15s; }
.btn:active { transform: scale(0.97); }
.btn-gold { background: var(--gradient-gold); color: #000; }
.btn-ghost { background: transparent; color: var(--gold-base); border-color: rgba(200, 168, 76, 0.4); }
.btn-ghost:hover { background: rgba(200, 168, 76, 0.1); }
.btn[disabled] { opacity: 0.4; cursor: default; transform: none; }
.btn-breit { width: 100%; }

/* Lektion */
.lektion { min-height: 100vh; display: flex; flex-direction: column; }
.lektion-kopf { display: flex; align-items: center; gap: 12px; padding: 12px 16px; max-width: 560px; width: 100%; margin: 0 auto; }
.schliessen { min-width: 48px; min-height: 48px; border-radius: 12px; border: none; background: transparent; color: var(--text-muted); font-size: 26px; }
.fortschritt { flex: 1; height: 14px; border-radius: 7px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.fortschritt span { display: block; height: 100%; background: var(--gradient-gold); border-radius: 7px; transition: width 0.3s; }
.herzen { font-weight: 700; color: var(--fehler-hell); font-size: 18px; white-space: nowrap; }
.uebung { flex: 1; max-width: 560px; width: 100%; margin: 0 auto; padding: 8px 16px 230px; }
.kontext { font-size: 15px; color: var(--text-secondary); margin-bottom: 6px; overflow-wrap: anywhere; }
.frage { font-size: 22px; font-weight: 600; line-height: 1.4; margin-bottom: 20px; overflow-wrap: anywhere; hyphens: auto; }
.frage.lang { font-size: 19px; font-weight: 500; }
.box { display: inline-block; min-width: 2.2em; padding: 0 6px; border: 2px dashed var(--gold-base); border-radius: 6px; text-align: center; color: var(--gold-light); }
.eingabe { width: 100%; min-height: 60px; padding: 0 16px; border-radius: 12px; border: 2px solid var(--border-strong); background: rgba(0, 30, 40, 0.6); color: var(--text); font-size: 24px; font-weight: 600; }
.eingabe:focus { outline: none; border-color: var(--gold-light); box-shadow: 0 0 0 3px rgba(200, 168, 76, 0.15); }
.wortfeld { min-height: 120px; padding: 12px 16px; font-size: 20px; line-height: 1.4; resize: none; overflow-wrap: anywhere; }
.eingabe::placeholder { color: var(--text-muted); font-weight: 400; font-size: 18px; }
.felder { display: flex; flex-wrap: wrap; gap: 12px; }
.feld { display: flex; align-items: center; gap: 8px; }
.feld .eingabe { width: 120px; text-align: center; }
.einheit { font-size: 22px; font-weight: 700; color: var(--gold-light); min-width: 2.2em; }
.label { display: block; font-size: 15px; color: var(--text-secondary); margin: 0 0 6px; }
.optionen { display: grid; gap: 10px; }
.optionen.zwei { grid-template-columns: 1fr 1fr; }
.optionen.drei { grid-template-columns: 1fr 1fr 1fr; }
.option { min-width: 0; overflow-wrap: anywhere; min-height: 58px; padding: 10px 16px; border-radius: 12px; border: 2px solid var(--border); background: var(--card); text-align: left; font-size: 19px; font-weight: 600; }
.option.zeichen { text-align: center; font-size: 30px; }
.option.gewaehlt { border-color: var(--gold-light); background: rgba(201, 168, 76, 0.15); }
.option.richtig { border-color: var(--ok-hell); background: rgba(45, 158, 107, 0.2); }
.option.falsch { border-color: var(--fehler-hell); background: rgba(184, 64, 64, 0.2); }
.paare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.paare .option { text-align: center; }
.paare .option.fertig { opacity: 0.45; border-color: var(--ok-hell); }
.wackeln { animation: wackeln 0.3s; }
@keyframes wackeln { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.diagramm { width: 100%; margin: 4px 0 18px; padding: 10px; border-radius: 12px; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border); }
.diagramm text { fill: var(--text); font-family: Inter, sans-serif; }

/* Feedback-Leiste */
.leiste { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); background: var(--bg-black); border-top: 1px solid var(--border); }
.leiste-innen { max-width: 560px; margin: 0 auto; }
.leiste.ok { background: #0B3B2C; border-top-color: var(--ok); }
.leiste.fehler { background: #3A1818; border-top-color: var(--fehler); }
.meldung { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.leiste.ok .meldung { color: var(--ok-hell); }
.leiste.fehler .meldung { color: var(--fehler-hell); }
.erklaer { font-size: 15px; margin-bottom: 12px; color: var(--text); }

/* Lernkatze (templates/katze.js) */
.katze { display: block; overflow: visible; }
.katze-karte { display: flex; align-items: center; gap: 14px; padding: 12px 16px; margin-bottom: 16px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); }
.katze-karte .katze { width: 92px; height: 92px; flex: none; }
.katze-karte b { font-family: 'Montserrat', sans-serif; font-size: 18px; color: var(--gold-light); }
.katze-karte p { font-size: 15px; color: var(--text); margin: 2px 0 8px; }
.katze-karte .btn { min-height: 44px; font-size: 14px; padding: 0 14px; }
.leiste-kopf { display: flex; align-items: flex-start; gap: 10px; }
.leiste-kopf > div:first-child { flex: 1; min-width: 0; }
.katze-sagt { flex: none; width: 112px; text-align: center; }
.katze-sagt .katze { width: 72px; height: 72px; margin: -6px auto 2px; }
.katze-sagt p { font-size: 12px; line-height: 1.3; color: var(--text); font-style: italic; margin-bottom: 8px; }
.ende-katze .katze { width: 150px; height: 150px; margin: 0 auto 6px; }
.katze-zeile { color: var(--text-secondary); margin-bottom: 4px; }
.kz-huepf { animation: kz-huepf 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.kz-wiegen { animation: kz-wiegen 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
.kz-auge { animation: kz-blinzeln 4s infinite; transform-box: fill-box; transform-origin: center; }
.kz-funke { animation: kz-funkeln 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.kz-funke:nth-of-type(2) { animation-delay: .4s; } .kz-funke:nth-of-type(3) { animation-delay: .8s; }
@keyframes kz-huepf { 0%, 50%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px); } 65% { transform: translateY(-4px); } }
@keyframes kz-wiegen { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes kz-blinzeln { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes kz-funkeln { 0%, 100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .kz-huepf, .kz-wiegen, .kz-auge, .kz-funke { animation: none; } }
/* Kleiderschrank (im Dialog von lernwerk.js) */
.kz-vorschau .katze { width: 150px; height: 150px; margin: 4px auto 10px; }
.kz-label { display: block; font-weight: 600; color: var(--gold-light); margin-bottom: 6px; }
.kz-gruppe { border: 0; padding: 0; margin: 16px 0 0; min-width: 0; }
.kz-gruppe legend { font-weight: 600; color: var(--gold-light); margin-bottom: 6px; padding: 0; }
.kz-wahl { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.kz-knopf { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px; border-radius: 12px; border: 2px solid rgba(200, 168, 76, .3); background: #00202A; color: var(--text); font-size: 14px; text-align: left; line-height: 1.2; }
.kz-knopf[aria-pressed="true"] { border-color: var(--gold-light); background: rgba(232, 201, 125, .15); }
.kz-knopf[aria-pressed="true"] span::after { content: ' ✓'; color: var(--gold-light); }
.kz-farbe { width: 22px; height: 22px; border-radius: 50%; flex: none; border: 2px solid #f6eedf; }
.kz-keine { background: repeating-linear-gradient(45deg, transparent 0 4px, rgba(246, 238, 223, .5) 4px 6px); }
.kz-icon { width: 22px; flex: none; text-align: center; font-style: normal; font-size: 18px; }
.kz-knopf small { display: block; font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.kz-knopf.zu { opacity: .75; border-style: dashed; cursor: default; }
.katze-karte .kz-knoepfe { display: flex; gap: 8px; flex-wrap: wrap; }
.kz-neu { display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 10px; background: #e0607a; color: #fff; font-size: 12px; font-weight: 700; }
/* Katzenalbum */
.kz-album-dialog h3 { margin: 20px 0 4px; font: 700 18px/1.3 'Montserrat', sans-serif; color: var(--gold-light); }
.kz-album-dialog h4 { margin: 12px 0 6px; font-size: 15px; font-weight: 600; color: var(--text); }
.kz-album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kz-platz { margin: 0; padding: 6px 4px 8px; border: 1px solid rgba(200, 168, 76, .3); border-radius: 12px; text-align: center; font-size: 12px; line-height: 1.3; color: var(--text-muted); position: relative; background: rgba(0, 0, 0, .15); }
.kz-platz .katze { width: 100%; height: auto; aspect-ratio: 1; padding: 4px; }
.kz-platz b { display: block; color: var(--text); font-size: 12px; }
.kz-platz.zu .katze { filter: brightness(0) invert(1) opacity(.14); }
.kz-platz.glaenzt:not(.zu) { border-color: var(--gold-light); background: rgba(232, 201, 125, .1); }
.kz-platz.neu::after { content: 'NEU'; position: absolute; top: -6px; right: -4px; padding: 1px 6px; border-radius: 8px; background: #e0607a; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .05em; }
.kz-code { margin: 12px 0 4px; }
.kz-code-reihe { display: flex; gap: 8px; }
.kz-code-reihe input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: .08em; }
.kz-code-reihe .lw-knopf { width: auto; margin-top: 0; padding: 0 16px; }
.kz-meldung { min-height: 1.4em; margin: 6px 0 0 !important; font-size: 14px; }
.kz-neu-karte { text-align: center; }
.kz-neu-karte p { margin-top: 10px; font-size: 14px; color: var(--text-secondary); }
.kz-neu-karte .kz-album { grid-template-columns: repeat(auto-fit, minmax(96px, 120px)); justify-content: center; }

/* Merke / Ende */
.karte { padding: 20px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); margin-bottom: 16px; }
.karte h2 { font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-base); margin-bottom: 10px; }
.merke p, .merke li { margin-bottom: 8px; }
.merke ul, .merke ol { padding-left: 22px; }
.merke strong { color: var(--gold-light); }
.merke table { border-collapse: collapse; margin: 8px 0 12px; width: 100%; font-size: 15px; }
.merke th, .merke td { border: 1px solid var(--border-strong); padding: 6px 8px; text-align: center; }
.merke th { color: var(--gold-light); background: rgba(201, 168, 76, 0.08); }
.ende { text-align: center; padding-top: 40px; }
.ende .gross { font-size: 64px; line-height: 1.1; margin-bottom: 8px; }
.ende h1 { font-size: 30px; margin-bottom: 8px; }
.ende .sterne { font-size: 40px; margin: 8px 0 16px; }
.ende .werte { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
.wissen { text-align: left; }
.stapel { display: grid; gap: 10px; }
.fuss { margin-top: 28px; text-align: center; font-size: 13px; color: var(--text-muted); }
.fuss .reihe { justify-content: center; }
.fuss .btn { min-height: 44px; font-size: 14px; flex: 0 1 auto; }
.versteckt { display: none !important; }

/* Name und Bericht (Startseite, Fach) */
.hallo { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
.hallo button { background: none; border: 0; color: var(--gold-light); font-weight: 700; min-height: 44px; padding: 0 4px; }
.fuss .btn-breit { flex: 1 1 100%; margin-bottom: 10px; }
.eltern-link { color: var(--text-muted); }

/* Elternansicht */
.karte .kind { font-size: 24px; letter-spacing: 0; text-transform: none; color: var(--gold-light); }
.klein { font-size: 13px; color: var(--text-muted); }
.tage-leiste { display: flex; gap: 4px; margin: 12px 0 4px; font-size: 18px; color: rgba(200, 168, 76, 0.35); }
.tage-leiste .ja { color: var(--gold-light); }
.fach-titel { font-size: 20px; color: var(--gold-light); margin: 22px 0 10px; }
.bericht-thema h3 { font-size: 17px; color: var(--gold-light); margin-bottom: 8px; }
.kennzahlen { display: flex; flex-wrap: wrap; gap: 6px; }
.kennzahlen .neu { color: var(--ok-hell); }
.verlauf { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 10px; margin-top: 12px; }
.verlauf svg { max-width: 100%; height: auto; }
.bericht-thema details { margin-top: 10px; }
.bericht-thema summary { cursor: pointer; color: var(--gold-base); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
ul.fehler { list-style: none; padding: 0; }
ul.fehler li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 15px; }
ul.fehler b { white-space: nowrap; color: var(--fehler-hell); font-weight: 600; }
.frueher { margin: 0 0 14px; padding: 0 4px; }
.frueher ul { padding-left: 20px; font-size: 15px; color: var(--text-secondary); }
.kinder { flex-wrap: wrap; margin-bottom: 14px; }
.kinder .btn { flex: 0 1 auto; min-height: 44px; }
.meldung-ok { border-color: var(--ok); }
.meldung-fehler { border-color: var(--fehler); }

/* Version und Update-Suche (Startseite) */
.version { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.version .btn { min-height: 44px; font-size: 13px; flex: 0 1 auto; }

/* Klassenarbeit: Auswahl auf den Themenkarten, Leiste unten, Übersichtsseite, Probe-Klassenarbeit */
.ka-wahl { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-top: 8px; padding: 0 14px; border-radius: 12px; border: 1px dashed var(--border-strong); position: relative; z-index: 1; cursor: pointer; font-weight: 600; font-size: 15px; color: var(--text); }
.ka-wahl input { width: 26px; height: 26px; accent-color: var(--gold-base); flex-shrink: 0; cursor: pointer; }
.ka-wahl:has(input:checked) { border-style: solid; border-color: var(--gold-light); background: rgba(200, 168, 76, 0.14); }
.ka-leiste { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg-black); border-top: 1px solid var(--gold-base); box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.45); }
.ka-leiste[hidden] { display: none; }
.ka-leiste .btn { width: 100%; max-width: 528px; margin: 0 auto; display: flex; }
body.mit-ka-leiste .wrap { padding-bottom: 110px; }
.ka-themen { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
.ka-themen .chip { white-space: normal; text-align: left; min-height: 32px; padding: 4px 12px; }
.ka-fakten { list-style: none; padding: 0; margin: 0 0 6px; display: grid; gap: 6px; font-size: 15px; }
.ka-fakten li::before { content: '✓ '; color: var(--gold-base); font-weight: 700; }
.ka-hinweis { font-size: 14px; color: var(--text-muted); margin-top: 10px; }
.ka-variante { font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--gold-light); }
.ka-uhr { font-weight: 700; color: var(--gold-light); font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }

      : '<path d="M100 105.5 Q97 112 91.5 109.5 M100 105.5 Q103 112 108.5 109.5" fill="none" stroke="' + Z + '" stroke-width="2.2" stroke-linecap="round"/>');
    s.push('<path d="M58 102 L34 98 M58 108 L35 112 M142 102 L166 98 M142 108 L165 112" stroke="' + Z + '" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>');
    s.push(hals.bild || '');
    if (requisit) s.push(REQUISITEN[requisit] || REQUISITEN.stern);
    // Pfoten: auf dem Boden, auf der Decke oder am Requisit
    var breit = BREIT.indexOf(requisit) >= 0;
    var pfY = requisit === 'lineal' ? 152 : breit ? 170 : requisit ? 162 : decke ? 150 : 184;
    var pfX = requisit === 'herz' ? 22 : breit ? 36 : requisit && requisit !== 'lineal' ? 30 : 16;
    s.push(pfote(100 - pfX, pfY, e) + pfote(100 + pfX, pfY, e));
    s.push(kopf.bild || '');
    if (stimmung === 'froh') s.push(funke(28, 48, GOLD) + funke(172, 40, ROSA) + funke(176, 92, GOLD));
    var kl = o.bewegung ? ' class="kz-' + o.bewegung + '"' : '';
    return '<svg class="katze" viewBox="0 0 200 200" aria-hidden="true" focusable="false"><g' + kl + '>' + s.join('') + '</g></svg>';
  }
  var SCHWANZ = 'M140 162 C180 162 184 120 164 106';
  var BREIT = ['schild', 'tafel', 'buch', 'diagramm']; // Pfoten halten diese Requisiten von unten an den Ecken
  var OHREN = '<path d="M54 72 L49 30 Q50 22 58 26 L88 45 Z"/><path d="M146 72 L151 30 Q150 22 142 26 L112 45 Z"/>';
  // Kuscheldecke mit flauschigem Rand: kleine Bögen entlang einer flachen Kurve
  var DECKE = (function () {
    var d = 'M38 152';
    for (var i = 1; i <= 10; i++) {
      var t = i / 10, tm = (i - 0.5) / 10;
      d += ' Q' + (38 + 124 * tm).toFixed(1) + ' ' + (145 - 44 * tm * (1 - tm)).toFixed(1) + ' ' + (38 + 124 * t).toFixed(1) + ' ' + (152 - 44 * t * (1 - t)).toFixed(1);
    }
    return d + ' L162 174 Q100 204 38 174 Z';
  })();
  function glanz() {
    var strahlen = '';
    for (var i = 0; i < 12; i++) {
      var w = i * Math.PI / 6, c = Math.cos(w), s = Math.sin(w);
      strahlen += 'M' + (100 + 74 * c).toFixed(1) + ' ' + (108 + 74 * s).toFixed(1) + ' L' + (100 + 94 * c).toFixed(1) + ' ' + (108 + 94 * s).toFixed(1) + ' ';
    }
    return '<circle cx="100" cy="108" r="84" fill="' + GOLD + '" opacity=".2"/><path d="' + strahlen + '" stroke="' + GOLD + '" stroke-width="7" stroke-linecap="round" opacity=".55"/>';
  }
  function stern(x, y, r, f, rand) {
    var d = '';
    for (var i = 0; i < 10; i++) {
      var w = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      d += (i ? 'L' : 'M') + (x + rr * Math.cos(w)).toFixed(1) + ' ' + (y + rr * Math.sin(w)).toFixed(1) + ' ';
    }
    return '<path d="' + d + 'Z" fill="' + f + '"' + (rand ? ' stroke="' + rand + '" stroke-width="2.5" stroke-linejoin="round"' : '') + '/>';
  }
  function bluemchen() {
    var b = '';
    for (var i = 0; i < 5; i++) {
      var w = -Math.PI / 2 + i * 2 * Math.PI / 5;
      b += '<circle cx="' + (66 + 7.5 * Math.cos(w)).toFixed(1) + '" cy="' + (48 + 7.5 * Math.sin(w)).toFixed(1) + '" r="6" fill="#fff4f6" stroke="' + LINIE + '" stroke-width="1.5"/>';
    }
    return b + '<circle cx="66" cy="48" r="4.5" fill="#f2c94c" stroke="' + LINIE + '" stroke-width="1.5"/>';
  }
  function lorbeer() {
    var b = '';
    for (var i = 0; i <= 12; i++) {
      var w = Math.PI * (0.93 - 0.86 * i / 12); // von links über oben nach rechts
      var x = 100 + 58 * Math.cos(w), y = 90 - 50 * Math.sin(w);
      var dreh = (-w * 180 / Math.PI + 90 + (i % 2 ? 35 : -35)).toFixed(0);
      b += '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" rx="8" ry="3.8" transform="rotate(' + dreh + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')" fill="#7fa650" stroke="#3f5f2a" stroke-width="1.5"/>';
    }
    return b;
  }
  function schal() {
    var b = '<path d="' + BAND + '" fill="#e0607a" stroke="' + LINIE + '" stroke-width="2.5" stroke-linejoin="round"/>';
    var st = '';
    for (var i = 1; i <= 6; i++) {
      var t = i / 7, x = 60 + 80 * t, oben = 120 + 40 * t * (1 - t);
      st += 'M' + x.toFixed(1) + ' ' + (oben + 1.5).toFixed(1) + ' v8 ';
    }
    return b + '<path d="' + st + '" stroke="#f6eedf" stroke-width="4"/>' +
      '<path d="M106 134 L116 132 L125 160 L112 163 Z" fill="#e0607a" stroke="' + LINIE + '" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="M109 142 L119 140 M111 151 L122 149" stroke="#f6eedf" stroke-width="3.5"/>';
  }
  function pfote(x, y, e) {
    return '<ellipse cx="' + x + '" cy="' + y + '" rx="13" ry="9" fill="' + e.fell + '" stroke="' + LINIE + '" stroke-width="3"/>' +
      '<path d="M' + (x - 4) + ' ' + (y + 2) + ' v5 M' + (x + 4) + ' ' + (y + 2) + ' v5" stroke="' + e.streifen + '" stroke-width="2" stroke-linecap="round"/>';
  }
  function auge(x, art, farbe, Z) {
    if (art === 'froh') return '<path d="M' + (x - 9) + ' 93 Q' + x + ' 81 ' + (x + 9) + ' 93" fill="none" stroke="' + Z + '" stroke-width="3.5" stroke-linecap="round"/>';
    if (art === 'sanft') return '<path d="M' + (x - 9) + ' 88 Q' + x + ' 97 ' + (x + 9) + ' 88" fill="none" stroke="' + Z + '" stroke-width="3.5" stroke-linecap="round"/>';
    if (art === 'schlaefrig') return '<path d="M' + (x - 9) + ' 90 Q' + x + ' 100 ' + (x + 9) + ' 90 Z" fill="' + farbe + '" stroke="' + LINIE + '" stroke-width="2"/>' +
      '<ellipse cx="' + x + '" cy="93.5" rx="2.6" ry="3" fill="' + LINIE + '"/><path d="M' + (x - 10) + ' 90 L' + (x + 10) + ' 90" stroke="' + Z + '" stroke-width="2.5" stroke-linecap="round"/>';
    return '<g class="kz-auge"><ellipse cx="' + x + '" cy="90" rx="9" ry="10" fill="' + farbe + '" stroke="' + LINIE + '" stroke-width="2"/>' +
      '<ellipse cx="' + x + '" cy="90.5" rx="3.6" ry="7.5" fill="' + LINIE + '"/><circle cx="' + (x - 3) + '" cy="85.5" r="2.6" fill="#fff"/></g>';
  }
  function funke(x, y, f) {
    return '<path class="kz-funke" d="M' + x + ' ' + (y - 9) + ' Q' + (x + 2) + ' ' + (y - 2) + ' ' + (x + 9) + ' ' + y + ' Q' + (x + 2) + ' ' + (y + 2) + ' ' + x + ' ' + (y + 9) +
      ' Q' + (x - 2) + ' ' + (y + 2) + ' ' + (x - 9) + ' ' + y + ' Q' + (x - 2) + ' ' + (y - 2) + ' ' + x + ' ' + (y - 9) + ' Z" fill="' + f + '"/>';
  }

  // Bild und Beschriftung zu einer Freischalt-id (Album, „Neu freigeschaltet!“)
  function thema(id) {
    for (var i = 0; i < DATEN.themen.length; i++) if (DATEN.themen[i].fach + '/' + DATEN.themen[i].thema === id) return DATEN.themen[i];
    return { titel: id };
  }
  function beschreibe(id) {
    var p = id.split(':');
    if (p[0] === 'kopf' || p[0] === 'hals') {
      var teil = (p[0] === 'kopf' ? KOPF : HALS)[p[1]];
      var o = { stimmung: 'froh' }; o[p[0]] = p[1];
      return { titel: teil.titel, art: p[0] === 'kopf' ? 'Für den Kopf' : 'Für den Hals', hinweis: teil.hinweis, bild: svg(o), teil: true };
    }
    var t = thema(p[1]), req = MOTIV[p[1]] || 'stern';
    if (p[2] === 'gold') return { titel: t.titel, art: 'Gold-Bild', hinweis: 'Belohnungscode für ein Blatt „' + t.titel + '“', bild: svg({ requisit: req, stimmung: 'froh', glanz: true, kopf: 'krone' }) };
    if (p[2] === '3') return { titel: t.titel, art: '3 Sterne', hinweis: '3 Sterne in „' + t.titel + '“', bild: svg({ requisit: req, stimmung: 'froh', glanz: true }) };
    return { titel: t.titel, art: 'Geschafft', hinweis: '„' + t.titel + '“ einmal schaffen', bild: svg({ requisit: req }) };
  }

  // ---------- Sprüche ----------
  var SPRUECHE = {
    hallo: ['{k} freut sich aufs Üben.', 'Bereit? {k} ist es!', '{k} hat schon auf dich gewartet.', 'Los geht’s – {k} ist dabei.'],
    froh: ['{k} macht einen Freudensprung!', '{k} schnurrt zufrieden.', '{k} ist stolz auf dich!', '{k} wackelt mit den Ohren.', 'Pfote drauf – sagt {k}.'],
    troest: ['Nicht schlimm – aus Fehlern lernt man.', 'Kopf hoch, beim nächsten Mal klappt’s!', 'Schau dir die Lösung in Ruhe an.', 'Fehler gehören zum Lernen dazu.', 'Du schaffst das!'],
    letztesHerz: ['Nur noch ein Herz – {k} drückt dir die Pfoten!'],
    geschafft: ['{k} feiert mit dir!', '{k} ist mächtig stolz auf dich!'],
    perfekt: ['Alles richtig! {k} tanzt vor Freude.'],
    verloren: ['Das war schwer. {k} kuschelt kurz mit dir – dann noch mal?'],
  };
  // gibt reinen Text zurück; beim Einbauen in HTML escapen
  function spruch(art) {
    var l = SPRUECHE[art] || SPRUECHE.hallo;
    return l[Math.floor(Math.random() * l.length)].split('{k}').join(name());
  }

  // ---------- Kleiderschrank ----------
  function anpassen(fertig) {
    aktualisiere();
    var k = lies();
    var erstes = !k.name;
    var esc = LERNWERK.esc;
    function gruppe(titel, feld, tabelle, muster) {
      return '<fieldset class="kz-gruppe"><legend>' + titel + '</legend><div class="kz-wahl">' + Object.keys(tabelle).map(function (id) {
        var t = tabelle[id], zu = (feld === 'kopf' || feld === 'hals') && !t.frei && k.frei.indexOf(feld + ':' + id) < 0;
        return '<button type="button" class="kz-knopf' + (zu ? ' zu' : '') + '" data-feld="' + feld + '" data-wert="' + id + '" aria-pressed="false"' + (zu ? ' disabled' : '') + '>' +
          (zu ? '<i class="kz-icon">🔒</i>' : muster(t)) + '<span>' + esc(t.titel) + (zu ? '<small>' + esc(t.hinweis) + '</small>' : '') + '</span></button>';
      }).join('') + '</div></fieldset>';
    }
    function punkt(f) { return '<i class="kz-farbe" style="background:' + f + '"></i>'; }
    function icon(t) { return '<i class="kz-icon">' + t.icon + '</i>'; }
    var d = LERNWERK.dialog('<form class="kz-schrank"><h2>' + (erstes ? 'Das ist deine Lernkatze!' : 'Kleiderschrank') + '</h2>' +
      '<p>' + (erstes ? 'Sie übt mit dir und freut sich mit dir. Gib ihr einen Namen und such dir aus, wie sie aussieht.' : 'Such dir aus, wie deine Katze aussieht. Mit 🔒 sind Schätze, die du dir erst verdienst.') + '</p>' +
      '<div class="kz-vorschau"></div>' +
      '<label class="kz-label" for="kz-name">Name</label><input id="kz-name" maxlength="16" autocomplete="off" placeholder="z. B. Maurice" value="' + esc(k.name) + '" required>' +
      gruppe('Fell', 'fell', FELLE, function (f) { return punkt(f.fell); }) +
      gruppe('Augen', 'augen', AUGEN, function (a) { return punkt(a.farbe); }) +
      gruppe('Kuscheldecke', 'decke', DECKEN, function (x) { return x.farbe ? punkt(x.farbe) : '<i class="kz-farbe kz-keine"></i>'; }) +
      gruppe('Kopf', 'kopf', KOPF, icon) +
      gruppe('Hals', 'hals', HALS, icon) +
      '<button class="lw-knopf" type="submit">' + (erstes ? 'Los geht’s!' : 'Fertig') + '</button></form>');
    var vorschau = d.querySelector('.kz-vorschau');
    function zeigen() {
      vorschau.innerHTML = svg({ aussehen: k, stimmung: 'froh', bewegung: 'huepf' });
      d.querySelectorAll('.kz-knopf').forEach(function (b) { b.setAttribute('aria-pressed', String(k[b.dataset.feld] === b.dataset.wert)); });
    }
    d.querySelectorAll('.kz-knopf').forEach(function (b) {
      b.onclick = function () { k[b.dataset.feld] = b.dataset.wert; zeigen(); };
    });
    zeigen();
    var feld = d.querySelector('#kz-name');
    if (erstes) feld.focus();
    d.querySelector('form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var n = feld.value.trim();
      if (!n) return feld.focus();
      var r = roh();
      ['fell', 'augen', 'decke', 'kopf', 'hals'].forEach(function (f) { r[f] = k[f]; });
      r.name = n;
      schreib(r);
      d.remove();
      if (fertig) fertig();
    });
  }

  // ---------- Belohnungscode (steht auf dem Lösungsblatt, siehe generator/belohnung.js) ----------
  function normCode(c) { return String(c).toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^MIAU/, ''); }
  function pruefsumme(c) {
    var h = 0x811c9dc5, s = normCode(c);
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(36);
  }
  // → { ok, ziel: 'fach/thema/V', titel, schon } bzw. { ok: false }
  function einloesen(code) {
    var ziel = normCode(code).length === 4 && DATEN.codes[pruefsumme(code)];
    if (!ziel) return { ok: false };
    var r = roh(), codes = liste(r.codes), schon = codes.indexOf(ziel) >= 0;
    if (!schon) { r.codes = codes.concat(ziel); ablegen(r); }
    var neu = aktualisiere();
    window.dispatchEvent(new Event('katze-geaendert'));
    return { ok: true, ziel: ziel, titel: thema(ziel.split('/').slice(0, 2).join('/')).titel, variante: ziel.split('/')[2], schon: schon, neu: neu };
  }

  // ---------- Album ----------
  function album() {
    aktualisiere();
    var esc = LERNWERK.esc;
    var d = LERNWERK.dialog('<div class="kz-album-dialog"></div>');
    var inhalt = d.querySelector('.kz-album-dialog');
    var meldung = '';
    function platz(id, k) {
      var b = beschreibe(id), frei = k.frei.indexOf(id) >= 0, neu = frei && k.gesehen.indexOf(id) < 0;
      return '<figure class="kz-platz' + (frei ? '' : ' zu') + (neu ? ' neu' : '') + (/:3$|:gold$/.test(id) ? ' glaenzt' : '') + '" data-id="' + id + '">' + b.bild +
        '<figcaption>' + (frei ? '<b>' + esc(b.teil ? b.titel : b.art) + '</b>' : '🔒 ' + (b.teil ? esc(b.titel) + ': ' : '') + esc(b.hinweis)) + '</figcaption></figure>';
    }
    function zeigen() {
      var k = lies();
      var faecher = {}, alle = [];
      DATEN.themen.forEach(function (t) {
        var f = faecher[t.fach] = faecher[t.fach] || { titel: t.fachTitel, themen: [] };
        f.themen.push(t);
        ['1', '3', 'gold'].forEach(function (s) { alle.push('motiv:' + t.fach + '/' + t.thema + ':' + s); });
      });
      var teile = [];
      [['kopf', KOPF], ['hals', HALS]].forEach(function (p) { Object.keys(p[1]).forEach(function (id) { if (p[1][id].bedingung) teile.push(p[0] + ':' + id); }); });
      alle = alle.concat(teile);
      var gesammelt = alle.filter(function (id) { return k.frei.indexOf(id) >= 0; }).length;
      inhalt.innerHTML = '<h2>📖 Katzenalbum</h2><p>' + gesammelt + ' von ' + alle.length + ' Bildern gesammelt. Jedes Thema hat drei: geschafft, 3 Sterne und Gold.</p>' +
        '<form class="kz-code"><label class="kz-label" for="kz-code">🎁 Belohnungscode von deinen Eltern</label>' +
        '<div class="kz-code-reihe"><input id="kz-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MIAU-…"><button class="lw-knopf" type="submit">Einlösen</button></div>' +
        '<p class="kz-meldung" role="status">' + meldung + '</p></form>' +
        Object.keys(faecher).map(function (f) {
          return '<h3>' + esc(faecher[f].titel) + '</h3>' + faecher[f].themen.map(function (t) {
            var id = t.fach + '/' + t.thema;
            return '<h4>' + esc(t.titel) + '</h4><div class="kz-album">' + ['1', '3', 'gold'].map(function (s) { return platz('motiv:' + id + ':' + s, k); }).join('') + '</div>';
          }).join('');
        }).join('') +
        '<h3>Schätze für den Kleiderschrank</h3><div class="kz-album">' + teile.map(function (id) { return platz(id, k); }).join('') + '</div>' +
        '<button class="lw-knopf leise" id="kz-zu">Schließen</button>';
      inhalt.querySelector('form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var feld = inhalt.querySelector('#kz-code');
        if (!feld.value.trim()) return;
        var r = einloesen(feld.value);
        meldung = !r.ok ? '✗ Diesen Code kenne ich nicht. Schau noch mal genau auf das Lösungsblatt.'
          : r.schon ? 'Diesen Code hast du schon eingelöst (' + esc(r.titel) + ', Blatt ' + r.variante + ').'
            : '✓ Super! Volle Punktzahl in „' + esc(r.titel) + '“ (Blatt ' + r.variante + '). Dein Gold-Bild ist da!';
        zeigen();
        if (!r.ok) inhalt.querySelector('#kz-code').value = feld.value;
      });
      inhalt.querySelector('#kz-zu').onclick = function () { d.remove(); };
      // was jetzt zu sehen war, gilt beim nächsten Öffnen nicht mehr als neu
      var r = roh(); r.gesehen = k.frei.slice(); ablegen(r);
      window.dispatchEvent(new Event('katze-geaendert'));
    }
    zeigen();
  }

  // Katzen-Karte für Startseite und Übersicht
  function karte(el) {
    if (!el || !lies().name) return;
    aktualisiere();
    var esc = LERNWERK.esc, n = anzahlNeu();
    el.hidden = false;
    el.innerHTML = svg({ stimmung: 'hallo' }) + '<div><b>' + esc(name()) + '</b><p>' + esc(spruch('hallo')) + '</p>' +
      '<div class="kz-knoepfe"><button class="btn btn-ghost" data-kz="anpassen">🎨 Anpassen</button><button class="btn btn-ghost" data-kz="album">📖 Album' +
      (n ? ' <span class="kz-neu">' + n + ' neu</span>' : '') + '</button></div></div>';
    el.querySelector('[data-kz="anpassen"]').onclick = function () { anpassen(); };
    el.querySelector('[data-kz="album"]').onclick = album;
  }

  // „Neu freigeschaltet!“ für den Abschluss-Bildschirm
  function neuHtml(ids) {
    if (!ids.length) return '';
    var esc = LERNWERK.esc;
    return '<section class="karte kz-neu-karte"><h2>Neu freigeschaltet!</h2><div class="kz-album">' + ids.map(function (id) {
      var b = beschreibe(id);
      return '<figure class="kz-platz neu' + (/:3$|:gold$/.test(id) ? ' glaenzt' : '') + '">' + b.bild + '<figcaption><b>' + esc(b.art) + '</b>' + esc(b.titel) + '</figcaption></figure>';
    }).join('') + '</div><p>' + (ids.some(function (id) { return /^(kopf|hals):/.test(id); }) ? 'Zieh es im Kleiderschrank an! ' : '') + 'Alles findest du im Album.</p></section>';
  }

  // Beim ersten Besuch (nach dem Namen des Kindes) die Katze vorstellen
  function start(fertig) {
    if (lies().name) { if (fertig) fertig(); return; }
    anpassen(fertig);
  }

  window.KATZE = {
    svg: svg, spruch: spruch, name: name, anpassen: anpassen, album: album, karte: karte, start: start, lies: lies,
    aktualisiere: aktualisiere, neuHtml: neuHtml, einloesen: einloesen, pruefsumme: pruefsumme, beschreibe: beschreibe,
    FELLE: FELLE, AUGEN: AUGEN, DECKEN: DECKEN, KOPF: KOPF, HALS: HALS, MOTIV: MOTIV, REQUISITEN: REQUISITEN,
  };
})();

<script>/* LERNWERK Fach-App (Browser). Erwartet window.LW (Generator-Bundle) und window.FACH (Themen-Daten aus dem Build).
   Ablauf: Übersicht → (Merke) → Lektion mit 5 Herzen → Abschluss. Lernstand nur in localStorage, Export/Import als JSON. */
(function () {
  'use strict';
  var FACH = window.FACH;
  var LW = window.LW;

  var app = document.getElementById('app');

  // ---------- Lernstand ----------
  function leer() { return { version: 1, xp: 0, streak: { tage: 0, letzterTag: null }, themen: {} }; }
  function laden() {
    try {
      var s = JSON.parse(localStorage.getItem(SPEICHER));
      return s && s.version === 1 ? s : leer();
    } catch (e) { return leer(); }
  }
  var stand = laden();
  function speichern() { try { localStorage.setItem(SPEICHER, JSON.stringify(stand)); } catch (e) { /* privater Modus */ } }
  function themaStand(id) {
    var k = FACH.id + '/' + id;
    stand.themen[k] = stand.themen[k] || { lektionen: 0, sterne: 0 };
    return stand.themen[k];
  }
  function tag(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function streakAktuell() {
    var s = stand.streak;
    if (!s.letzterTag) return 0;
    var gestern = new Date(); gestern.setDate(gestern.getDate() - 1);
    return s.letzterTag === tag() || s.letzterTag === tag(gestern) ? s.tage : 0;
  }
  function streakZaehlen() {
    var heute = tag();
    var gestern = new Date(); gestern.setDate(gestern.getDate() - 1);
    if (stand.streak.letzterTag === heute) return;
    stand.streak.tage = stand.streak.letzterTag === tag(gestern) ? stand.streak.tage + 1 : 1;
    stand.streak.letzterTag = heute;
  }

  // ---------- Klassenarbeit: gewählte Lernbereiche und Variante (Arbeit und Lösung passen über die Variante zusammen) ----------
  var KA_SPEICHER = 'lernwerk_klassenarbeit_v1';
  function neueVariante() { var z = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = ''; for (var i = 0; i < 4; i++) s += z[Math.floor(Math.random() * z.length)]; return s; }
  function kaLaden() {
    try {
      var s = JSON.parse(localStorage.getItem(KA_SPEICHER));
      if (s && Array.isArray(s.themen) && s.variante) return s;
    } catch (e) { /* leer */ }
    return { themen: [], variante: neueVariante() };
  }
  var KA = kaLaden();
  function kaSpeichern() { try { localStorage.setItem(KA_SPEICHER, JSON.stringify(KA)); } catch (e) { /* privater Modus */ } }
  function kaThemen() { return FACH.themen.filter(function (t) { return KA.themen.indexOf(t.thema) >= 0 && t.klassenarbeit && t.klassenarbeit.length; }); }

  // ---------- Hilfen ----------
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function mitBox(s) { return esc(s).replace(/∎/g, '<span class="box">?</span>'); }
  function sterne(n) { return '★★★'.slice(0, n) + '☆☆☆'.slice(0, 3 - n); }
  function mischen(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function normWort(s) {
    var t = String(s).toLowerCase().replace(/[-–]/g, ' ').replace(/\s+/g, ' ').trim();
    // „einhundert“ = „hundert“, „eintausend“ = „tausend“
    for (var i = 0; i < 3; i++) t = t.replace(/(^| |tausend)ein(hundert|tausend)/g, '$1$2');
    return t.replace(/ /g, ''); // „sieben Millionen …“ = „siebenmillionen…“
  }
  function abstand(a, b) {
    var d = [];
    for (var i = 0; i <= a.length; i++) { d[i] = [i]; }
    for (var j = 0; j <= b.length; j++) { d[0][j] = j; }
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];

  // Säulen-/Balkendiagramm für den Bildschirm (Gold auf Teal)

    if (d.art === 'balken') {
      var lb = 92, zeile = 34, breite = 320, x0 = lb, e = (breite - lb - 12) / top, h = n * zeile + 30;
      for (var i = 0; i <= top; i += 2) teile.push('<line x1="' + (x0 + i * e) + '" y1="4" x2="' + (x0 + i * e) + '" y2="' + (n * zeile + 4) + '" stroke="rgba(255,255,255,.15)"/><text x="' + (x0 + i * e) + '" y="' + (n * zeile + 20) + '" font-size="12" text-anchor="middle">' + i + '</text>');
      d.kategorien.forEach(function (k, j) {
        var y = 4 + j * zeile + 7;
        teile.push('<text x="' + (x0 - 6) + '" y="' + (y + 15) + '" font-size="13" text-anchor="end">' + esc(k) + '</text><rect x="' + x0 + '" y="' + y + '" width="' + d.werte[j] * e + '" height="20" rx="3" fill="url(#g)"/>');
      });
      return '<svg class="diagramm" viewBox="0 0 ' + breite + ' ' + h + '" role="img" aria-label="Balkendiagramm"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#B8922A"/><stop offset="1" stop-color="#E8C97D"/></linearGradient></defs>' + teile.join('') + '<line x1="' + x0 + '" y1="4" x2="' + x0 + '" y2="' + (n * zeile + 4) + '" stroke="#E8C97D" stroke-width="1.5"/></svg>';
    }
    var B = 320, H = 210, x0 = 30, yB = 170, e2 = (yB - 14) / top, sp = (B - x0 - 6) / n;
    for (var k = 0; k <= top; k += 2) teile.push('<line x1="' + x0 + '" y1="' + (yB - k * e2) + '" x2="' + B + '" y2="' + (yB - k * e2) + '" stroke="rgba(255,255,255,.15)"/><text x="' + (x0 - 6) + '" y="' + (yB - k * e2 + 4) + '" font-size="12" text-anchor="end">' + k + '</text>');
    d.kategorien.forEach(function (kat, j) {
      var x = x0 + j * sp + sp * 0.2;
      teile.push('<rect x="' + x + '" y="' + (yB - d.werte[j] * e2) + '" width="' + sp * 0.6 + '" height="' + d.werte[j] * e2 + '" rx="3" fill="url(#g)"/><text x="' + (x + sp * 0.3) + '" y="' + (yB + 18) + '" font-size="12" text-anchor="middle">' + esc(kat) + '</text>');
    });
    return '<svg class="diagramm" viewBox="0 0 ' + B + ' ' + H + '" role="img" aria-label="Säulendiagramm"><defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#B8922A"/><stop offset="1" stop-color="#E8C97D"/></linearGradient></defs>' + teile.join('') + '<line x1="' + x0 + '" y1="' + yB + '" x2="' + B + '" y2="' + yB + '" stroke="#E8C97D" stroke-width="1.5"/></svg>';
  }

  // Probe-Klassenarbeit: jede Teilaufgabe wird eine Übung; keine Herzen, kein Sofort-Feedback, Uhr läuft rückwärts.
  // BE einer Aufgabe werden gleichmäßig auf ihre Teile verteilt. Zeichnen gibt es nur auf Papier.
  var kaUhr = null;
  function starteKA(themen) {
    var ka = LW.stelleZusammen({ themen: themen, uebergreifend: FACH.uebergreifend || [], seed: 'probe-' + Date.now() + '-' + Math.random() });
    var uebungen = [], nurPapier = [];
    ka.aufgaben.forEach(function (a, i) {
      var teile = a.nur === 'druck' ? [] : a.teile.filter(function (t) { return t.eingabe !== 'zeichnung'; });
      if (!teile.length) { nurPapier.push(a); return; }
      teile.forEach(function (t) { uebungen.push({ a: a, t: t, nr: i + 1, be: a.be / teile.length, teil: teile.length > 1 ? t.label : '' }); });
    });
    L = { modus: 'ka', ka: ka, uebungen: uebungen, nurPapier: nurPapier, i: 0, herzen: HERZEN, fehler: 0, xp: 0, richtig: 0, beantwortet: 0, aufgaben: {}, be: 0, ergebnisse: [], start: Date.now(), themen: themen };
    clearInterval(kaUhr);
    kaUhr = setInterval(uhrZeigen, 1000);
    zeigeUebung();
  }
  function uhrZeigen() {
    var el = document.getElementById('ka-uhr');
    if (!el || !L || L.modus !== 'ka') return;
    var rest = L.ka.dauer * 60 - Math.floor((Date.now() - L.start) / 1000), r = Math.abs(rest);
    el.textContent = (rest < 0 ? '⏱ +' : '⏱ ') + Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0');
    el.classList.toggle('um', rest < 0);
    el.setAttribute('aria-label', rest < 0 ? 'Zeit ist um' : 'noch ' + Math.ceil(rest / 60) + ' Minuten');
  }
  function kaAntwort(erg, u) {
    L.beantwortet++;
    if (erg.richtig) { L.richtig++; L.xp += 10; L.be += u.be; } else L.fehler++;
    L.ergebnisse.push({ u: u, richtig: !!erg.richtig });
    var pa = L.aufgaben[u.a.id] = L.aufgaben[u.a.id] || { l: String(u.a.bezeichnung || u.a.anweisung).slice(0, 80), r: 0, f: 0 };
    if (erg.richtig) pa.r++; else pa.f++;
    L.i++;
    if (L.i >= L.uebungen.length) return kaEnde();
    zeigeUebung();
  }
  function halbe(x) { return String(Math.round(x * 2) / 2).replace('.', ','); }
  function kaEnde() {
    clearInterval(kaUhr);
    window.scrollTo(0, 0);
    var moeglich = L.uebungen.reduce(function (s, u) { return s + u.be; }, 0);
    var anteil = moeglich ? L.be / moeglich : 0;
    var minuten = Math.max(1, Math.round((Date.now() - L.start) / 60000));
    var summe = function (liste, nurRichtig) { return liste.filter(function (e) { return !nurRichtig || e.richtig; }).reduce(function (s, e) { return s + e.u.be; }, 0); };
    var bereiche = L.themen.map(function (t) {
      var es = L.ergebnisse.filter(function (e) { return e.u.a.thema === t.thema; });
      return { t: t, m: summe(es), r: summe(es, true) };
    }).filter(function (b) { return b.m > 0; });
    var ueber = L.ergebnisse.filter(function (e) { return !e.u.a.thema; });
    if (ueber.length) bereiche.push({ t: { titel: 'Verbindende Aufgaben', icon: '🔗' }, m: summe(ueber), r: summe(ueber, true) });
    var schwach = bereiche.filter(function (b) { return b.t.thema && b.r / b.m < 0.8; }).sort(function (a, b) { return a.r / a.m - b.r / b.m; })[0];
    var falsch = L.ergebnisse.filter(function (e) { return !e.richtig; });
    if (window.LERNWERK) LERNWERK.protokolliere({ fach: FACH.id, fachTitel: FACH.titel, thema: 'klassenarbeit', titel: 'Probe-Klassenarbeit', richtig: L.richtig, gesamt: L.beantwortet, geschafft: anteil >= 0.5, aufgaben: L.aufgaben });
    stand.xp += L.xp + 30;
    streakZaehlen();
    speichern();
    var gut = anteil >= 0.5;
    var html = (KZ ? '<div class="ende-katze">' + KZ.svg({ stimmung: gut ? 'froh' : 'troest', bewegung: gut ? 'huepf' : 'wiegen' }) + '</div>' : '') +
      '<h1 class="gold">Probe geschafft!</h1>' +
      '<div class="ka-ergebnis">' + halbe(L.be) + ' / ' + halbe(moeglich) + ' BE</div>' +
      '<p style="margin:6px 0 14px">' + Math.round(anteil * 100) + ' % richtig · ' + minuten + ' von ' + L.ka.dauer + ' Minuten</p>' +
      '<div class="werte"><span class="chip">⭐ +' + (L.xp + 30) + ' XP</span><span class="chip">🔥 ' + streakAktuell() + ' ' + (streakAktuell() === 1 ? 'Tag' : 'Tage') + '</span></div>' +
      (KZ ? KZ.neuHtml(KZ.aktualisiere()) : '') +
      '<section class="karte"><h2>Lernbereiche</h2>' + bereiche.map(function (b) {
        return '<div class="ka-bereich"><div class="zeile"><span>' + (b.t.icon || '') + ' ' + esc(b.t.titel) + '</span><b>' + halbe(b.r) + ' / ' + halbe(b.m) + ' BE</b></div><div class="ka-balken"><span style="width:' + Math.round(100 * b.r / b.m) + '%"></span></div></div>';
      }).join('') +
      (schwach ? '<p style="margin-top:6px">Am meisten bringt dir jetzt: <b>' + esc(schwach.t.titel) + '</b></p><button class="btn btn-gold btn-breit" id="ka-ueben" style="margin-top:10px">▶ ' + esc(schwach.t.titel) + ' üben</button>' : '<p style="margin-top:6px">Alle Lernbereiche sitzen gut. Stark!</p>') + '</section>' +
      (falsch.length ? '<section class="karte"><h2>Das schauen wir uns noch mal an</h2><ol class="ka-fehler">' + falsch.map(function (e) {
        var t = e.u.t, f = frageTexte(e.u);
        var loes = t.eingabe === 'richtig_falsch' ? (t.loesung ? 'richtig' : 'falsch') : t.antwort;
        var kurz = function (s) { return s.length > 140 ? s.slice(0, 140) + ' …' : s; };
        var frage = f.label ? kurz(f.haupt) + ' – ' + f.label : (f.kontext ? kurz(f.kontext) + ' – ' : '') + f.haupt;
        return '<li>' + mitBox(frage) + '<br><span class="richtig">✓ ' + esc(loes) + '</span>' + (e.u.a.weg ? '<br><span class="weg">So geht’s: ' + esc(e.u.a.weg) + '</span>' : '') + '</li>';
      }).join('') + '</ol></section>' : '') +
      (L.nurPapier.length ? '<p class="ka-hinweis">' + L.nurPapier.length + (L.nurPapier.length === 1 ? ' Aufgabe gibt' : ' Aufgaben gibt') + ' es nur auf Papier (z. B. ein Diagramm zeichnen). Sie zählen hier nicht mit.</p>' : '');
    app.innerHTML = '<div class="wrap ende">' + html + '<div class="stapel" style="margin-top:16px"><button class="btn btn-gold btn-breit" id="ka-nochmal">▶ Neue Probe</button>' +
      '<button class="btn btn-ghost btn-breit" id="ka-zurueck">Zur Klassenarbeit</button><button class="btn btn-ghost btn-breit" id="uebersicht">Zur Übersicht</button></div></div>';
    var themen = L.themen;
    document.getElementById('ka-nochmal').onclick = function () { starteKA(themen); };
    document.getElementById('ka-zurueck').onclick = klassenarbeitSeite;
    document.getElementById('uebersicht').onclick = uebersicht;
    var ueben = document.getElementById('ka-ueben');
    if (ueben) ueben.onclick = function () { starte(schwach.t); };
  }

  function merke(t) {
    window.scrollTo(0, 0);
    app.innerHTML = '<div class="wrap"><header class="kopf"><button class="zurueck" aria-label="Zurück">←</button><h1>' + t.icon + ' ' + esc(t.titel) + '</h1></header>' +
      '<section class="karte merke"><h2>Merke</h2>' + t.erklaerungHtml + '</section>' +
      '<button class="btn btn-gold btn-breit">▶ Los geht’s!</button></div>';
    app.querySelector('.zurueck').onclick = uebersicht;
    app.querySelector('.btn-gold').onclick = function () { starte(t); };
  }

  // ---------- Lektion ----------
  var L; // aktuelle Lektion

  // jede Instanz-Teilaufgabe wird eine Übung; „zeichnen“ gibt es nur auf Papier
  function uebungenFuer(t) {
    var seed = String(Date.now()) + Math.random();
    var liste = [];
    t.aufgaben.forEach(function (a) {
      if (a.nur === 'druck') return;
      var inst = LW.instanz(a, seed);
      if (inst.nur === 'druck') return;
      inst.teile.forEach(function (teil) {
        if (teil.eingabe === 'zeichnung') return;
        liste.push({ a: inst, t: teil });
      });
    });
    // gemischt, aber von leicht nach schwer
    liste = mischen(liste).sort(function (x, y) { return x.a.schwierigkeit - y.a.schwierigkeit; });
    if (liste.length > MAX_UEBUNGEN) {
      // aus jeder Aufgabe mindestens eine Übung behalten
      var proAufgabe = {};
      var auswahl = [];
      liste.forEach(function (u) { if (!proAufgabe[u.a.id]) { proAufgabe[u.a.id] = 1; auswahl.push(u); } });
      liste.forEach(function (u) { if (auswahl.length < MAX_UEBUNGEN && auswahl.indexOf(u) < 0) auswahl.push(u); });
      liste = auswahl.slice(0, MAX_UEBUNGEN).sort(function (x, y) { return x.a.schwierigkeit - y.a.schwierigkeit; });
    }
    return liste;
  }

  function starte(t) {
    L = { thema: t, uebungen: uebungenFuer(t), i: 0, herzen: HERZEN, fehler: 0, xp: 0, richtig: 0, beantwortet: 0, aufgaben: {} };
    zeigeUebung();
  }

  function frageTexte(u) {
    var a = u.a, t = u.t;
    if (t.frageWeb) return { haupt: t.frageWeb, kontext: '' };
    // Sachaufgabe: Aufgabentext oben, Teil als Beschriftung („Fahrzeit: ∎ h ∎ min“ → „Fahrzeit“)
    if (a.weg !== undefined) return { haupt: a.anweisung, kontext: '', label: t.text === 'Ergebnis' ? 'Deine Antwort' : t.text.replace(/\s*∎.*$/, '').replace(/:$/, '') };
    if (!t.text) return { haupt: a.anweisung, kontext: '' };
    return { haupt: t.text, kontext: a.anweisung };
  }

  function zeigeUebung() {
    window.scrollTo(0, 0);
    var u = L.uebungen[L.i];
    var f = frageTexte(u);
    var t = u.t;
    var koerper = '';
    if (u.a.daten && u.a.daten.zeigen === 'diagramm') koerper += diagrammSvg(u.a.daten);
    if (t.eingabe === 'zahl' || t.eingabe === 'wort') {
      koerper += (f.label ? '<label class="label" for="antwort">' + esc(f.label) + '</label>' : '') +
        (t.eingabe === 'zahl'
          ? (t.komma
            ? '<input id="antwort" class="eingabe" autocomplete="off" inputmode="decimal" placeholder="Zahl, z. B. 3,5">'
            : '<input id="antwort" class="eingabe" autocomplete="off" inputmode="numeric" placeholder="Zahl eingeben">')
          // Zahlwörter sind lang: mehrzeilig, damit das ganze Wort sichtbar bleibt
          : '<textarea id="antwort" class="eingabe wortfeld" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Als Wort schreiben"></textarea>');
    } else if (t.eingabe === 'felder') {
      // 217 min = ∎ h ∎ min: ein Feld je Einheit
      koerper += (f.label ? '<p class="label">' + esc(f.label) + '</p>' : '') + '<div class="felder">' + t.felder.map(function (e, i) {
        return '<label class="feld"><input class="eingabe" data-i="' + i + '" autocomplete="off" inputmode="numeric" aria-label="' + esc(e) + '"><span class="einheit">' + esc(e) + '</span></label>';
      }).join('') + '</div>';
    } else if (t.eingabe === 'wahl' || t.eingabe === 'richtig_falsch' || t.eingabe === 'begruendung') {
      // Begründung: auf Papier frei geschrieben, hier die passende Erklärung wählen
      var opts = t.eingabe === 'richtig_falsch' ? ['richtig', 'falsch'] : t.optionen;
      var zeichen = opts.every(function (o) { return String(o).length <= 2; });
      var spalten = zeichen && opts.length === 3 ? ' drei' : opts.length <= 4 && (zeichen || t.eingabe === 'richtig_falsch') ? ' zwei' : '';
      koerper += (f.label ? '<p class="label">' + esc(f.label) + '</p>' : '') + '<div class="optionen' + spalten + '">' + opts.map(function (o) {
        var anzeige = t.eingabe === 'richtig_falsch' ? (o === 'richtig' ? '✓ richtig' : '✗ falsch') : o;
        return '<button class="option' + (zeichen ? ' zeichen' : '') + '" data-wert="' + esc(o) + '">' + esc(anzeige) + '</button>';
      }).join('') + '</div>';
    } else if (t.eingabe === 'paare') {
      var links = mischen(t.paare.map(function (p) { return p[0]; }));
      var rechts = mischen(t.paare.map(function (p) { return p[1]; }));
      koerper += '<div class="paare">' + links.map(function (l, i) {
        var gross = function (w) { return String(w).length <= 2 ? ' zeichen' : ''; };
        return '<button class="option' + gross(l) + '" data-seite="l" data-wert="' + esc(l) + '">' + esc(l) + '</button><button class="option' + gross(rechts[i]) + '" data-seite="r" data-wert="' + esc(rechts[i]) + '">' + esc(rechts[i]) + '</button>';
      }).join('') + '</div>';
    }
    var lang = f.haupt.length > 90;
    var ka = L.modus === 'ka';
    app.innerHTML = '<div class="lektion">' +
      '<div class="lektion-kopf"><button class="schliessen" aria-label="' + (ka ? 'Probe beenden' : 'Übung beenden') + '">✕</button>' +
      '<div class="fortschritt" role="progressbar" aria-valuemin="0" aria-valuemax="' + L.uebungen.length + '" aria-valuenow="' + L.i + '"><span style="width:' + (100 * L.i / L.uebungen.length) + '%"></span></div>' +
      (ka ? '<span class="ka-uhr" id="ka-uhr"></span>' : '<span class="herzen" aria-label="' + L.herzen + ' Herzen">♥ ' + L.herzen + '</span>') + '</div>' +
      '<main class="uebung">' + (ka ? '<p class="ka-nr">Aufgabe ' + u.nr + (u.teil ? ' ' + esc(u.teil) : '') + ' · ' + u.a.be + ' BE</p>' : '') +
      (f.kontext ? '<p class="kontext">' + mitBox(f.kontext) + '</p>' : '') +
      '<p class="frage' + (lang ? ' lang' : '') + '">' + mitBox(f.haupt) + '</p>' + koerper + '</main>' +
      '<div class="leiste" id="leiste"><div class="leiste-innen"><button class="btn btn-gold btn-breit" id="pruefen" disabled>' + (ka ? 'Weiter' : 'Prüfen') + '</button>' +
      (ka ? '<button class="btn btn-ghost ka-ueberspringen" id="ka-skip">Weiß ich nicht – weiter</button>' : '') + '</div></div></div>';

    if (ka) {
      uhrZeigen();
      document.getElementById('ka-skip').onclick = function () { kaAntwort({ richtig: false }, u); };
    }
    app.querySelector('.schliessen').onclick = function () {
      if (!ka) { if (confirm('Übung wirklich beenden? Der Fortschritt dieser Übung geht verloren.')) uebersicht(); return; }
      if (confirm('Probe-Klassenarbeit beenden? Sie wird nicht ausgewertet.')) { clearInterval(kaUhr); klassenarbeitSeite(); }
    };
    var pruefen = document.getElementById('pruefen');
    var gewaehlt = null;
    var feld = document.getElementById('antwort');
    if (feld) {
      feld.focus();
      feld.addEventListener('input', function () { pruefen.disabled = !feld.value.trim(); });
      feld.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (feld.value.trim()) pruefen.click();
      });
    }
    app.querySelectorAll('.optionen .option').forEach(function (b) {
      b.onclick = function () {
        app.querySelectorAll('.optionen .option').forEach(function (x) { x.classList.remove('gewaehlt'); });
        b.classList.add('gewaehlt');
        gewaehlt = b.dataset.wert;
        pruefen.disabled = false;
      };
    });
    var felder = [].slice.call(app.querySelectorAll('.felder input'));
    felder.forEach(function (f, i) {
      f.addEventListener('input', function () { pruefen.disabled = felder.some(function (x) { return !x.value.trim(); }); });
      f.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (i < felder.length - 1) felder[i + 1].focus(); else if (!pruefen.disabled) pruefen.click();
      });
    });
    if (felder.length) felder[0].focus();
    if (t.eingabe === 'paare') paareSpielen(t);
    pruefen.onclick = function () {
      var ergebnis = felder.length ? bewerte(t, felder.map(function (f) { return f.value; }))
        : feld ? bewerte(t, feld.value) : bewerte(t, gewaehlt);
      if (ka) return kaAntwort(ergebnis, u); // Klassenarbeit: keine Auflösung zwischendurch
      if (feld) feld.disabled = true;
      felder.forEach(function (f) { f.disabled = true; });
      app.querySelectorAll('.optionen .option').forEach(function (b) {
        b.disabled = true;
        if (b.dataset.wert === String(t.eingabe === 'richtig_falsch' ? (t.loesung ? 'richtig' : 'falsch') : t.loesung)) b.classList.add('richtig');
        else if (b.dataset.wert === gewaehlt) b.classList.add('falsch');
      });
      rueckmeldung(ergebnis, u);
    };
  }

  function paareSpielen(t) {
    var richtig = {};
    t.paare.forEach(function (p) { richtig[p[0]] = p[1]; });
    var links = null, fertig = 0, fehlerGemacht = false;
    app.querySelectorAll('.paare .option').forEach(function (b) {
      b.onclick = function () {
        if (b.classList.contains('fertig')) return;
        if (b.dataset.seite === 'l') {
          app.querySelectorAll('.paare [data-seite="l"]').forEach(function (x) { x.classList.remove('gewaehlt'); });
          b.classList.add('gewaehlt');
          links = b;
          return;
        }
        if (!links) return;
        if (richtig[links.dataset.wert] === b.dataset.wert) {
          links.classList.remove('gewaehlt');
          links.classList.add('fertig'); b.classList.add('fertig');
          links.disabled = b.disabled = true;
          links = null;
          if (++fertig === t.paare.length) rueckmeldung({ richtig: !fehlerGemacht }, L.uebungen[L.i]);
        } else {
          fehlerGemacht = true;
          b.classList.add('wackeln'); setTimeout(function () { b.classList.remove('wackeln'); }, 300);
        }
      };
    });
    document.getElementById('pruefen').classList.add('versteckt');
  }

  function bewerte(t, eingabe) {
    if (t.eingabe === 'zahl') {
      var soll = Number(t.loesung);
      // bei Kommazahlen zählt auch "3.5" (Handy-Tastatur ohne Komma)
      return { richtig: LW.gleich(LW.parseZahl(eingabe, !Number.isInteger(soll)), soll) };
    }
    if (t.eingabe === 'felder') {
      return { richtig: t.loesung.every(function (w, i) { return LW.gleich(LW.parseZahl(eingabe[i]), w); }) };
    }
    if (t.eingabe === 'wort') {
      var a = normWort(eingabe), b = normWort(t.loesung);
      if (a === b) return { richtig: true };
      if (b.length > 8 && abstand(a, b) === 1) return { richtig: true, hinweis: 'Fast perfekt! Achte auf die Schreibweise: ' + t.antwort };
      return { richtig: false };
    }
    if (t.eingabe === 'richtig_falsch') return { richtig: (eingabe === 'richtig') === t.loesung };
    return { richtig: String(eingabe) === String(t.loesung) };
  }

  var LOB = ['Richtig!', 'Super!', 'Klasse!', 'Genau!', 'Stark!', 'Prima!'];
  function rueckmeldung(erg, u) {
    if (L.modus === 'ka') return kaAntwort(erg, u); // Zuordnung meldet sich selbst, sobald alle Paare stehen
    var leiste = document.getElementById('leiste');
    if (erg.richtig) { L.xp += 10; L.richtig++; } else { L.herzen--; L.fehler++; }
    // fürs Lernprotokoll: Ergebnis je Aufgabe der Inhaltsdatei (Bezeichnung, sonst die Arbeitsanweisung)
    L.beantwortet++;
    var pa = L.aufgaben[u.a.id] = L.aufgaben[u.a.id] || { l: String(u.a.bezeichnung || u.a.anweisung).slice(0, 80), r: 0, f: 0 };
    if (erg.richtig) pa.r++; else pa.f++;
    var erklaer = '';
    if (erg.hinweis) erklaer = erg.hinweis;
    else if (!erg.richtig) erklaer = 'Richtige Lösung: <b>' + esc(u.t.eingabe === 'richtig_falsch' ? (u.t.loesung ? 'richtig' : 'falsch') : u.t.antwort) + '</b>';
    if (!erg.richtig && u.a.weg) erklaer += '<br>So geht’s: ' + esc(u.a.weg);
    leiste.className = 'leiste ' + (erg.richtig ? 'ok' : 'fehler');
    var katze = erg.richtig ? katzeMit('froh', 'froh', 'huepf')
      : katzeMit('troest', L.herzen === 1 ? 'letztesHerz' : 'troest', 'wiegen');
    leiste.innerHTML = '<div class="leiste-innen" role="status"><div class="leiste-kopf"><div><p class="meldung">' + (erg.richtig ? '✓ ' + LOB[Math.floor(Math.random() * LOB.length)] : '✗ Nicht ganz.') + '</p>' +
      (erklaer ? '<p class="erklaer">' + erklaer + '</p>' : '') + '</div>' + katze + '</div><button class="btn btn-gold btn-breit" id="weiter">Weiter</button></div>';
    app.querySelector('.herzen').textContent = '♥ ' + L.herzen;
    var weiter = document.getElementById('weiter');
    weiter.focus();
    weiter.onclick = function () {
      if (L.herzen <= 0) return ende(false);
      L.i++;
      if (L.i >= L.uebungen.length) return ende(true);
      zeigeUebung();
    };
  }

  function ende(geschafft) {
    window.scrollTo(0, 0);
    var t = L.thema;
    var html;
    if (window.LERNWERK) LERNWERK.protokolliere({ fach: FACH.id, fachTitel: FACH.titel, thema: t.thema, titel: t.titel, richtig: L.richtig, gesamt: L.beantwortet, geschafft: geschafft, aufgaben: L.aufgaben });
    if (geschafft) {
      var st = L.fehler === 0 ? 3 : L.fehler <= 2 ? 2 : 1;
      var bonus = 20 + (L.fehler === 0 ? 10 : 0);
      var gewinn = L.xp + bonus;
      var ts = themaStand(t.thema);
      ts.lektionen++; ts.sterne = Math.max(ts.sterne, st); ts.letzte = tag();
      stand.xp += gewinn;
      streakZaehlen();
      speichern();
      var wissen = t.wissenswertes && t.wissenswertes.length ? t.wissenswertes[Math.floor(Math.random() * t.wissenswertes.length)] : '';
      html = (KZ ? '<div class="ende-katze">' + KZ.svg({ stimmung: 'froh', bewegung: 'huepf' }) + '</div>' : '<div class="gross" aria-hidden="true">' + (st === 3 ? '🏆' : '🎉') + '</div>') +
        '<h1 class="gold">Geschafft!</h1>' + (KZ ? '<p class="katze-zeile">' + esc(KZ.spruch(st === 3 ? 'perfekt' : 'geschafft')) + '</p>' : '') +
        '<div class="sterne" aria-label="' + st + ' von 3 Sternen">' + sterne(st) + '</div>' +
        '<div class="werte"><span class="chip">⭐ +' + gewinn + ' XP</span><span class="chip">🔥 ' + streakAktuell() + ' ' + (streakAktuell() === 1 ? 'Tag' : 'Tage') + '</span></div>' +
        (KZ ? KZ.neuHtml(KZ.aktualisiere()) : '') +
        (wissen ? '<section class="karte wissen"><h2>Wusstest du schon?</h2><p>' + esc(wissen) + '</p></section>' : '');
    } else {
      html = (KZ ? '<div class="ende-katze">' + KZ.svg({ stimmung: 'troest', bewegung: 'wiegen' }) + '</div>' : '<div class="gross" aria-hidden="true">💪</div>') +
        '<h1>Keine Herzen mehr</h1><p style="margin:8px 0 24px">' + (KZ ? esc(KZ.spruch('verloren')) + ' ' : 'Das war schwer – aber Üben macht stark! ') + 'Schau dir das Merke an und versuch es noch einmal.</p>';
    }
    app.innerHTML = '<div class="wrap ende">' + html + '<div class="stapel"><button class="btn btn-gold btn-breit" id="nochmal">' + (geschafft ? '▶ Nochmal üben' : '▶ Nochmal versuchen') + '</button>' +
      (geschafft ? '' : '<button class="btn btn-ghost btn-breit" id="merke">💡 Merke ansehen</button>') +
      '<button class="btn btn-ghost btn-breit" id="uebersicht">Zur Übersicht</button></div></div>';
    document.getElementById('nochmal').onclick = function () { starte(t); };
    document.getElementById('uebersicht').onclick = uebersicht;
    var m = document.getElementById('merke'); if (m) m.onclick = function () { merke(t); };
  }

  // ---------- Export / Import ----------
  function exportieren() {
    var blob = new Blob([JSON.stringify(stand, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lernwerk-lernstand-' + tag() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function importieren(e) {
    var datei = e.target.files[0];
    if (!datei) return;
    datei.text().then(function (text) {
      var neu = JSON.parse(text);
      if (!neu || neu.version !== 1 || typeof neu.xp !== 'number' || typeof neu.themen !== 'object') throw new Error('Format');
      if (!confirm('Lernstand aus der Datei übernehmen? Der aktuelle Stand auf diesem Gerät wird ersetzt.')) return;
      stand = neu; speichern(); uebersicht();
    }).catch(function () { alert('Diese Datei ist kein LERNWERK-Lernstand.'); });
  }

  // Testzugang für den automatischen Mobil-Test (liest nur die aktuelle Lösung)
  window.LERNWERK_TEST = { loesung: function () { var u = L && L.uebungen[L.i]; return u && u.t; } };

  // Rückkehr von der Druckseite (klassenarbeit.html → ./#klassenarbeit) landet wieder auf der Klassenarbeit
  if (location.hash === '#klassenarbeit' && kaThemen().length) klassenarbeitSeite();
  else uebersicht();
})();
</script>
<style>
.update-banner{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;max-width:456px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:52px;border:1px solid #C9A84C;border-radius:14px;background:#002B36;color:#F5F0E6;font:600 15px/1.3 Inter,system-ui,sans-serif;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:pointer;animation:ub-rein .25s ease-out}
.update-banner[hidden]{display:none}.update-banner:disabled{opacity:.7}
.update-banner .ub-text{flex:1;min-width:0}
.update-banner .ub-aktion{flex-shrink:0;padding:6px 12px;border-radius:999px;background:linear-gradient(135deg,#B8922A,#E8C97D);color:#000;font-weight:700}
@keyframes ub-rein{from{transform:translateY(140%);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.update-banner{animation:none}}
</style>
<button id="update-banner" class="update-banner" type="button" hidden><span aria-hidden="true">⬆️</span><span class="ub-text">Neue Inhalte verfügbar</span><span class="ub-aktion">Aktualisieren</span></button>
<script>
(function () {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  var banner = document.getElementById('update-banner');
  function zeigen() { banner.hidden = false; }
  // erst neu laden, wenn die neue Version übernommen hat – ein Neuladen mitten im Wechsel kann hängen bleiben
  var neuLaden = function () { neuLaden = function () {}; location.reload(); };
  banner.addEventListener('click', function () {
    banner.disabled = true;
    banner.querySelector('.ub-aktion').textContent = '…';
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg || !reg.waiting) return neuLaden();
      navigator.serviceWorker.addEventListener('controllerchange', function () { neuLaden(); });
      setTimeout(function () { neuLaden(); }, 3000);
      reg.waiting.postMessage('SKIP_WAITING');
    }).catch(function () { neuLaden(); });
  });
  navigator.serviceWorker.register('../sw.js', { scope: '../' }).then(function (reg) {
    // beim allerersten Besuch (noch kein Controller) gibt es nichts zu aktualisieren
    var hatteController = !!navigator.serviceWorker.controller;
    if (reg.waiting && hatteController) zeigen();
    reg.addEventListener('updatefound', function () {
      var neu = reg.installing;
      if (neu) neu.addEventListener('statechange', function () { if (neu.state === 'installed' && hatteController) zeigen(); });
    });
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (hatteController) zeigen(); });
    reg.update().catch(function () {});
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
    // Startseite: Version anzeigen und von Hand nach Updates suchen
    var v = document.getElementById('version');
    if (!v) return;
    var text = v.querySelector('span'), knopf = v.querySelector('button');
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data && e.data.version) text.textContent = 'Version ' + String(e.data.version).replace('lernwerk-', '').slice(0, 7);
    });
    if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('VERSION');
    knopf.hidden = false;
    knopf.addEventListener('click', function () {
      knopf.disabled = true; knopf.textContent = 'Suche …';
      reg.update().then(function () {
        var laedt = reg.installing || reg.waiting;
        if (reg.waiting) zeigen();
        knopf.textContent = laedt ? (reg.waiting ? 'Update bereit – unten tippen' : 'Update wird geladen …') : '✓ Neueste Version';
        if (reg.installing) reg.installing.addEventListener('statechange', function () { if (reg.waiting) knopf.textContent = 'Update bereit – unten tippen'; });
      }).catch(function () { knopf.textContent = 'Kein Internet – später noch mal'; })
        .then(function () { setTimeout(function () { knopf.disabled = false; }, 1500); });
    });
  }).catch(function () {});
})();
</script></body></html>
