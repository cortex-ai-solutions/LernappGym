<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Geschichte 5. Klasse – Lern-App</title>
<style>
  :root{
    --bg: #f4efe6;
    --card: #ffffff;
    --ink: #2b2420;
    --ink-soft: #6b6055;
    --accent: #a6462b;
    --accent-2: #2f6f5e;
    --accent-3: #c98a2c;
    --line: #e4dccd;
    --good: #2f8f5b;
    --bad: #c04a3a;
    --shadow: 0 6px 18px rgba(60,45,30,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:40px;
  }
  .app{max-width:720px;margin:0 auto;padding:18px 16px 8px;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  header.top h1{
    font-size:1.15rem;margin:0;letter-spacing:0.02em;
    display:flex;align-items:center;gap:8px;
  }
  header.top h1 .ico{font-size:1.3rem;}
  .backbtn{
    border:none;background:var(--card);color:var(--accent);
    font-family:inherit;font-weight:bold;font-size:0.95rem;
    padding:8px 12px;border-radius:10px;box-shadow:var(--shadow);
  }
  .subtitle{color:var(--ink-soft);font-size:0.85rem;margin:-8px 0 16px;}

  /* Home: lesson list */
  .lesson-card{
    background:var(--card);border-radius:16px;box-shadow:var(--shadow);
    padding:14px 16px;margin-bottom:12px;
    display:flex;align-items:center;gap:12px;
    border-left:6px solid var(--accent-3);
  }
  .lesson-card .week{
    font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--ink-soft);
  }
  .lesson-card h3{margin:2px 0 4px;font-size:1.05rem;}
  .lesson-card p{margin:0;font-size:0.8rem;color:var(--ink-soft);}
  .lesson-card .stars{font-size:0.95rem;color:var(--accent-3);white-space:nowrap;}
  .lesson-card .arrow{margin-left:auto;color:var(--ink-soft);font-size:1.2rem;padding-left:6px;}

  .progress-banner{
    background:linear-gradient(135deg,var(--accent-2),#1f5346);
    color:#fff;border-radius:16px;padding:16px;margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .progress-banner .big{font-size:1.6rem;font-weight:bold;}
  .progress-banner .label{font-size:0.8rem;opacity:0.85;}
  .bar-bg{background:rgba(255,255,255,0.25);border-radius:8px;height:8px;margin-top:10px;overflow:hidden;}
  .bar-fill{background:#fff;height:100%;border-radius:8px;transition:width 0.4s;}

  .note-box{
    background:#fdf6e8;border:1px dashed var(--accent-3);border-radius:12px;
    padding:10px 12px;font-size:0.78rem;color:#7a5a1e;margin-bottom:16px;
  }

  /* Lesson view */
  .tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
  .tab-btn{
    flex:none;border:none;padding:8px 14px;border-radius:20px;font-family:inherit;
    font-size:0.82rem;font-weight:bold;background:var(--card);color:var(--ink-soft);
    box-shadow:var(--shadow);
  }
  .tab-btn.active{background:var(--accent);color:#fff;}

  .card{
    background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .card h4{
    margin:0 0 8px;color:var(--accent);font-size:1.02rem;
    border-bottom:2px solid var(--line);padding-bottom:6px;
  }
  .card p{margin:0 0 8px;line-height:1.5;font-size:0.94rem;}
  .card p:last-child{margin-bottom:0;}
  .card ul{margin:6px 0;padding-left:20px;font-size:0.9rem;line-height:1.5;}
  .example{
    background:#f6f1e6;border-left:4px solid var(--accent-3);
    padding:8px 10px;border-radius:8px;font-size:0.86rem;font-style:italic;margin-top:8px;
  }

  table.src-table{width:100%;border-collapse:collapse;font-size:0.82rem;margin-top:6px;}
  table.src-table th{background:var(--accent-2);color:#fff;padding:6px 4px;text-align:left;}
  table.src-table td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.src-table tr:nth-child(even){background:#faf7f0;}

  .timeline{position:relative;margin:18px 4px 6px;padding-left:6px;}
  .timeline .track{position:relative;height:4px;background:var(--line);border-radius:2px;margin:30px 0 10px;}
  .timeline .dot{
    position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;
    background:var(--accent);transform:translateX(-50%);border:2px solid #fff;box-shadow:0 0 0 1px var(--accent);
  }
  .timeline .tlabel{
    position:absolute;top:-38px;transform:translateX(-50%);font-size:0.68rem;
    text-align:center;width:90px;color:var(--ink-soft);
  }
  .timeline .ylabel{
    position:absolute;top:10px;transform:translateX(-50%);font-size:0.65rem;
    color:var(--ink-soft);white-space:nowrap;
  }

  /* Flashcards */
  .flash-wrap{perspective:1000px;height:170px;margin-bottom:14px;}
  .flash{
    position:relative;width:100%;height:100%;transition:transform 0.5s;
    transform-style:preserve-3d;cursor:pointer;
  }
  .flash.flipped{transform:rotateY(180deg);}
  .flash-face{
    position:absolute;inset:0;backface-visibility:hidden;
    border-radius:16px;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:18px;font-size:1rem;line-height:1.4;
  }
  .flash-front{background:var(--accent);color:#fff;font-weight:bold;}
  .flash-back{background:var(--card);color:var(--ink);transform:rotateY(180deg);font-size:0.92rem;}
  .flash-hint{text-align:center;font-size:0.75rem;color:var(--ink-soft);margin:-6px 0 14px;}
  .flash-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
  .flash-nav button{
    border:none;background:var(--card);box-shadow:var(--shadow);border-radius:10px;
    padding:8px 14px;font-family:inherit;font-weight:bold;color:var(--accent);font-size:0.85rem;
  }
  .flash-count{font-size:0.8rem;color:var(--ink-soft);}

  /* Match game */
  .match-cols{display:flex;gap:10px;}
  .match-col{flex:1;}
  .match-item{
    background:var(--card);border:2px solid var(--line);border-radius:10px;
    padding:8px 10px;margin-bottom:8px;font-size:0.82rem;text-align:center;
    box-shadow:var(--shadow);
  }
  .match-item.selected{border-color:var(--accent);background:#fbeee7;}
  .match-item.correct{border-color:var(--good);background:#e9f7ee;}
  .match-item.wrong{border-color:var(--bad);background:#fbeceb;animation:shake 0.3s;}
  @keyframes shake{25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .match-status{text-align:center;font-size:0.85rem;margin-top:6px;color:var(--ink-soft);}

  /* Quiz */
  .q-progress{font-size:0.78rem;color:var(--ink-soft);margin-bottom:6px;}
  .q-text{font-size:1rem;font-weight:bold;margin-bottom:14px;}
  .opt{
    display:block;width:100%;text-align:left;background:var(--card);
    border:2px solid var(--line);border-radius:12px;padding:11px 14px;
    margin-bottom:10px;font-family:inherit;font-size:0.9rem;color:var(--ink);
    box-shadow:var(--shadow);
  }
  .opt.correct{border-color:var(--good);background:#e9f7ee;}
  .opt.wrong{border-color:var(--bad);background:#fbeceb;}
  .opt:disabled{opacity:0.85;}
  .feedback{font-size:0.85rem;margin:10px 0;padding:10px 12px;border-radius:10px;}
  .feedback.good{background:#e9f7ee;color:var(--good);}
  .feedback.bad{background:#fbeceb;color:var(--bad);}
  .next-btn{
    display:block;width:100%;padding:12px;border:none;border-radius:12px;
    background:var(--accent);color:#fff;font-family:inherit;font-weight:bold;
    font-size:0.95rem;margin-top:6px;
  }
  .quiz-result{text-align:center;padding:20px 10px;}
  .quiz-result .score{font-size:2.2rem;font-weight:bold;color:var(--accent);}
  .quiz-result .msg{color:var(--ink-soft);margin:8px 0 18px;font-size:0.9rem;}
  .restart-btn{
    border:none;background:var(--accent-2);color:#fff;padding:11px 20px;
    border-radius:12px;font-family:inherit;font-weight:bold;font-size:0.9rem;
  }

  .empty{text-align:center;color:var(--ink-soft);padding:40px 10px;font-size:0.9rem;}
</style>
</head>
<body><script>/* LERNWERK – gemeinsamer Teil aller Seiten (Mathe, Latein, Geschichte, Start, Eltern):
   Name des Kindes, Lernprotokoll je Fach/Thema, Bericht an die Eltern als Link.
   Alles bleibt auf dem Gerät. Der Bericht steckt im #-Teil des Links, und der wird nie an einen Server geschickt. */
(function () {
  'use strict';
  var PROFIL = 'lernwerk_profil';
  var PROTOKOLL = 'lernwerk_protokoll_v1';
  var MAX_VERLAUF = 15; // Runden je Thema im Verlauf
  var MAX_TAGE = 60; // Lerntage
  var MAX_FEHLER = 12; // häufigste Fehler je Thema im Bericht

  function lies(k, leer) { try { return JSON.parse(localStorage.getItem(k)) || leer; } catch (e) { return leer; } }
  function schreib(k, w) { try { localStorage.setItem(k, JSON.stringify(w)); } catch (e) { /* privater Modus */ } }
  function tag(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---------- Profil ----------
  // id unterscheidet zwei Kinder mit gleichem Namen in der Elternansicht
  function profil() {
    var p = lies(PROFIL, {});
    if (!p.id) { p.id = Math.random().toString(36).slice(2, 10); schreib(PROFIL, p); }
    return p;
  }
  function setzeName(name) { var p = profil(); p.name = name; schreib(PROFIL, p); }

  // ---------- Protokoll ----------
  function leeresProtokoll() { return { v: 1, tage: [], faecher: {} }; }

  // Eine Übungsrunde: { fach, fachTitel, thema, titel, richtig, gesamt, geschafft, aufgaben: { schluessel: { l: Bezeichnung, r, f } } }
  function protokolliere(e) {
    var p = lies(PROTOKOLL, leeresProtokoll());
    var heute = tag();
    if (p.tage.indexOf(heute) < 0) p.tage = p.tage.concat(heute).slice(-MAX_TAGE);
    var f = p.faecher[e.fach] = p.faecher[e.fach] || { ti: e.fachTitel, th: {} };
    var t = f.th[e.thema] = f.th[e.thema] || { n: 0, ok: 0, r: 0, g: 0, h: [], a: {} };
    t.ti = e.titel; t.n++; t.z = heute;
    if (e.geschafft) t.ok++;
    t.r += e.richtig; t.g += e.gesamt;
    t.h = t.h.concat([[heute, e.richtig, e.gesamt, e.geschafft ? 1 : 0]]).slice(-MAX_VERLAUF);
    Object.keys(e.aufgaben || {}).forEach(function (k) {
      var a = e.aufgaben[k], alt = t.a[k] || [a.l, 0, 0];
      t.a[k] = [a.l, alt[1] + a.r, alt[2] + a.f];
    });
    schreib(PROTOKOLL, p);
  }

  // Stände der Apps von vor dem Protokoll, damit auch der erste Bericht etwas zeigt
  function staende() {
    var m = lies('lernwerk_v1', null), la = lies('latina_state', null), ge = lies('geschichte_lernapp_progress_v1', null);
    var s = {};
    if (m && m.themen) {
      s.mathematik = {};
      Object.keys(m.themen).forEach(function (k) { s.mathematik[k.split('/').pop()] = [m.themen[k].lektionen, m.themen[k].sterne]; });
    }
    if (la) s.latein = { xp: la.xp || 0, fertig: (la.completedLessons || []).length };
    if (ge) {
      s.geschichte = {};
      Object.keys(ge).forEach(function (k) { s.geschichte[k] = [ge[k].bestScore, ge[k].total]; });
    }
    return s;
  }

  function bericht() {
    var pr = profil(), p = lies(PROTOKOLL, leeresProtokoll());
    var faecher = {};
    Object.keys(p.faecher).forEach(function (fid) {
      var f = p.faecher[fid], th = {};
      Object.keys(f.th).forEach(function (tid) {
        var t = f.th[tid];
        // nur Fehlerschwerpunkte mitschicken, das hält den Link kurz
        var fehler = Object.keys(t.a).map(function (k) { return t.a[k]; })
          .filter(function (a) { return a[2] > 0; })
          .sort(function (x, y) { return y[2] - x[2] || y[2] / (y[1] + y[2]) - x[2] / (x[1] + x[2]); })
          .slice(0, MAX_FEHLER);
        th[tid] = { ti: t.ti, n: t.n, ok: t.ok, r: t.r, g: t.g, z: t.z, h: t.h, a: fehler };
      });
      faecher[fid] = { ti: f.ti, th: th };
    });
    return { v: 1, n: pr.name || 'Ohne Namen', i: pr.id, t: Date.now(), tage: p.tage, f: faecher, s: staende() };
  }

  // ---------- Link kodieren (deflate + base64url) ----------
  function b64url(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).split('+').join('-').split('/').join('_').split('=').join('');
  }
  function vonB64url(s) {
    s = s.split('-').join('+').split('_').join('/');
    while (s.length % 4) s += '=';
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function strom(bytes, umwandler) {
    return new Response(new Blob([bytes]).stream().pipeThrough(umwandler)).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  function packen(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream === 'undefined') return Promise.resolve('j' + b64url(bytes));
    return strom(bytes, new CompressionStream('deflate-raw')).then(function (b) { return 'z' + b64url(b); });
  }
  function auspacken(code) {
    var art = code.charAt(0), bytes = vonB64url(code.slice(1));
    var fertig = art === 'z' ? strom(bytes, new DecompressionStream('deflate-raw')) : Promise.resolve(bytes);
    return fertig.then(function (b) { return JSON.parse(new TextDecoder().decode(b)); });
  }

  // ---------- Oberfläche ----------
  var CSS = '.lw-schleier{position:fixed;inset:0;z-index:80;background:rgba(0,20,26,.82);display:flex;align-items:center;justify-content:center;padding:16px}' +
    '.lw-dialog{width:100%;max-width:420px;max-height:calc(100vh - 32px);overflow-y:auto;background:#002B36;color:#F5F0E6;border:1px solid #C9A84C;border-radius:18px;padding:24px 20px;font:16px/1.45 Inter,system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.5)}' +
    '.lw-dialog h2{margin:0 0 6px;font:700 22px/1.25 Montserrat,Inter,system-ui,sans-serif;color:#E8C97D}' +
    '.lw-dialog p{margin:0 0 14px;color:#C9D4D6}' +
    '.lw-dialog input,.lw-dialog textarea{width:100%;box-sizing:border-box;min-height:52px;padding:12px 14px;border-radius:12px;border:1px solid rgba(200,168,76,.5);background:#00202A;color:#F5F0E6;font:inherit;font-size:18px}' +
    '.lw-dialog textarea{font-size:13px;min-height:90px;word-break:break-all}' +
    '.lw-knopf{display:flex;width:100%;align-items:center;justify-content:center;min-height:52px;margin-top:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#B8922A,#E8C97D);color:#000;font:700 16px Inter,system-ui,sans-serif;cursor:pointer}' +
    '.lw-knopf.leise{background:transparent;color:#E8C97D;border:1px solid rgba(200,168,76,.4)}';
  function stil() {
    if (document.getElementById('lw-stil')) return;
    var s = document.createElement('style'); s.id = 'lw-stil'; s.textContent = CSS; document.head.appendChild(s);
  }
  function dialog(html) {
    stil();
    var d = document.createElement('div');
    d.className = 'lw-schleier';
    d.innerHTML = '<div class="lw-dialog" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(d);
    return d;
  }

  // Beim ersten Start: „Wie heißt du?“ (der Name bleibt auf dem Gerät und steht nur im Bericht)
  function frageName(fertig) {
    var alt = profil().name || '';
    var d = dialog('<form><h2>' + (alt ? 'Name ändern' : 'Hallo! Wie heißt du?') + '</h2><p>Dein Name steht auf dem Bericht für deine Eltern. Er bleibt auf diesem Handy.</p>' +
      '<input id="lw-name" maxlength="30" autocomplete="given-name" placeholder="Dein Vorname" value="' + esc(alt) + '" required><button class="lw-knopf" type="submit">Los geht’s!</button></form>');
    var feld = d.querySelector('#lw-name');
    feld.focus();
    d.querySelector('form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var name = feld.value.trim();
      if (!name) return;
      setzeName(name);
      d.remove();
      if (fertig) fertig(name);
    });
  }

  // prefix: Weg von der aktuellen Seite zur Wurzel der App, z. B. '../'
  function berichtLink(prefix) {
    return packen(bericht()).then(function (code) { return new URL((prefix || '') + 'eltern/', location.href).href + '#b=' + code; });
  }
  function senden(prefix) {
    var name = profil().name;
    if (!name) return frageName(function () { senden(prefix); });
    return berichtLink(prefix).then(function (url) {
      var titel = 'LERNWERK-Bericht von ' + name;
      if (navigator.share) return navigator.share({ title: titel, text: titel + ' – zum Öffnen tippen:', url: url }).catch(function () {});
      // ohne Teilen-Menü (z. B. am PC): Link zum Kopieren zeigen
      var d = dialog('<h2>Bericht an deine Eltern</h2><p>Kopiere diesen Link und schick ihn deinen Eltern.</p><textarea id="lw-link" readonly>' + esc(url) + '</textarea>' +
        '<button class="lw-knopf" id="lw-kopieren">Link kopieren</button><button class="lw-knopf leise" id="lw-zu">Schließen</button>');
      var feld = d.querySelector('#lw-link');
      d.querySelector('#lw-kopieren').onclick = function () {
        feld.select();
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).catch(function () { document.execCommand('copy'); });
        this.textContent = '✓ Kopiert';
      };
      d.querySelector('#lw-zu').onclick = function () { d.remove(); };
    });
  }

  // Auf Kinder-Seiten: beim ersten Besuch nach dem Namen fragen, danach (oder sofort) fertig()
  function start(fertig) {
    function los() { if (profil().name) { if (fertig) fertig(); } else frageName(fertig); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', los);
    else los();
  }

  window.LERNWERK = {
    profil: profil, setzeName: setzeName, frageName: frageName, start: start, dialog: dialog,
    protokolliere: protokolliere, bericht: bericht, berichtLink: berichtLink, senden: senden,
    packen: packen, auspacken: auspacken, tag: tag, esc: esc,
  };
})();
</script>
<script>LERNWERK.start();</script>
<div class="app" id="app"></div>

<script>
/* ============================================================
   GESCHICHTE 5. KLASSE — LERN-APP
   Selbstständige HTML-Datei, keine Installation nötig.
   ------------------------------------------------------------
   ERWEITERN: Um eine neue Lektion (Woche) hinzuzufügen, einfach
   ein weiteres Objekt in das LESSONS-Array unten einfügen. Jede
   Lektion braucht: id, week, title, intro, sections[], flashcards[],
   match (optional), quiz[]. Die App zeigt neue Einträge automatisch
   auf der Startseite an — es muss sonst nichts angepasst werden.
   ============================================================ */

const LESSONS = [
  {
    id: "l1",
    week: 1,
    title: "Was ist Geschichte?",
    icon: "📜",
    intro: "Was ist eigentlich der Unterschied zwischen einer „Geschichte“ und der „Geschichte“ als Schulfach?",
    sections: [
      {
        heading: "Geschichten ≠ Geschichte",
        html: `
          <p><strong>Geschichten</strong> sind Erzählungen, die oft erfunden sind. Sie können ausgedacht sein oder Fantasie enthalten, wie Märchen, Comics oder Filme.</p>
          <div class="example">Beispiel: „Es war einmal ein Drache, der in einem Schloss lebte …“ – das ist eine <strong>Geschichte</strong>.</div>
          <p style="margin-top:14px;"><strong>Geschichte</strong> (das Schulfach) beschäftigt sich mit wirklich passiertem Geschehen in der Vergangenheit. Historiker suchen Beweise dafür, was passiert ist – wie ein Detektiv.</p>
          <div class="example">Beispiel: „Vor 200 Jahren gab es einen Kaiser in Deutschland.“ – das ist <strong>Geschichte</strong>, weil es auf echten Ereignissen beruht.</div>
        `
      },
      {
        heading: "Was können wir herausfinden?",
        html: `
          <ul>
            <li><strong>Vergangenes Geschehen</strong> – Was ist passiert?</li>
            <li><strong>Ort, Raum</strong> – Wo ist es passiert?</li>
            <li><strong>Zeit</strong> – Wann ist es passiert?</li>
            <li><strong>Handelnde Personen</strong> – Wer hat wie gehandelt?</li>
            <li><strong>Zusammenhänge</strong> – Warum ist es passiert?</li>
          </ul>
          <p>Diese fünf Fragen stellen sich Historikerinnen und Historiker bei jedem Thema — sie sind ein gutes Werkzeug für die Klassenarbeit!</p>
        `
      }

const STORAGE_KEY = "geschichte_lernapp_progress_v1";

function loadProgress(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}
let progress = loadProgress();

function getLessonProgress(id){
  return progress[id] || { bestScore: 0, total: 0, done: false };
}
function setLessonResult(id, score, total){
  const cur = getLessonProgress(id);
  if(score > cur.bestScore || cur.total === 0){
    progress[id] = { bestScore: score, total: total, done: true };
    saveProgress(progress);
  }
}

let state = { view: "home", lessonId: null, tab: "lernen" };

function starString(score, total){
  if(total === 0) return "☆☆☆";
  const ratio = score/total;
  const filled = ratio >= 0.8 ? 3 : ratio >= 0.5 ? 2 : ratio > 0 ? 1 : 0;
  return "★".repeat(filled) + "☆".repeat(3-filled);
}

function render(){
  const root = document.getElementById("app");
  root.innerHTML = "";
  if(state.view === "home") renderHome(root);
  else renderLesson(root);
  window.scrollTo(0,0);
}

function renderHome(root){
  const totalLessons = LESSONS.length;
  const doneLessons = LESSONS.filter(l => getLessonProgress(l.id).done).length;
  const pct = totalLessons ? Math.round((doneLessons/totalLessons)*100) : 0;

  const header = document.createElement("header");
  header.className = "top";
  header.innerHTML = `<h1><span class="ico">📚</span> Geschichte – 5. Klasse</h1>`;
  root.appendChild(header);

  const sub = document.createElement("div");
  sub.className = "subtitle";
  sub.textContent = "Deine Lernkarten für die erste Geschichtsarbeit";
  root.appendChild(sub);

  const banner = document.createElement("div");
  banner.className = "progress-banner";
  banner.innerHTML = `
    <div class="label">Fortschritt</div>
    <div class="big">${doneLessons} / ${totalLessons} Lektionen geschafft</div>
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
  `;
  root.appendChild(banner);

  const note = document.createElement("div");
  note.className = "note-box";
  note.innerHTML = "💡 Neue Lektionen kommen nach und nach dazu, wenn im Unterricht neue Themen behandelt werden.";
  root.appendChild(note);

  LESSONS.slice().sort((a,b)=>a.week-b.week).forEach(lesson=>{
    const p = getLessonProgress(lesson.id);
    const card = document.createElement("div");
    card.className = "lesson-card";
    card.innerHTML = `
      <div style="font-size:1.6rem;">${lesson.icon || "📘"}</div>
      <div style="flex:1;">
        <div class="week">Woche ${lesson.week}</div>
        <h3>${lesson.title}</h3>
        <p>${p.done ? "Quiz: " + p.bestScore + "/" + p.total + " richtig" : "Noch nicht bearbeitet"}</p>
      </div>
      <div class="stars">${starString(p.bestScore, p.total)}</div>
      <div class="arrow">›</div>
    `;
    card.onclick = () => { state.view = "lesson"; state.lessonId = lesson.id; state.tab = "lernen"; render(); };
    root.appendChild(card);
  });
}

function renderLesson(root){
  const lesson = LESSONS.find(l => l.id === state.lessonId);
  if(!lesson){ state.view = "home"; render(); return; }

  const header = document.createElement("header");
  header.className = "top";
  header.innerHTML = `<button class="backbtn">‹ Zurück</button><h1>${lesson.title}</h1><span></span>`;
  header.querySelector(".backbtn").onclick = () => { state.view = "home"; render(); };
  root.appendChild(header);

  const sub = document.createElement("div");
  sub.className = "subtitle";
  sub.textContent = "Woche " + lesson.week;
  root.appendChild(sub);

  const tabs = document.createElement("div");
  tabs.className = "tabs";
  const tabDefs = [
    { key: "lernen", label: "📖 Lernen" },
    { key: "karten", label: "🔄 Karteikarten" },
  ];
  if(lesson.match) tabDefs.push({ key: "zuordnen", label: "🔗 Zuordnen" });
  tabDefs.push({ key: "quiz", label: "✏️ Quiz" });

  tabDefs.forEach(t=>{
    const b = document.createElement("button");
    b.className = "tab-btn" + (state.tab === t.key ? " active" : "");
    b.textContent = t.label;
    b.onclick = () => { state.tab = t.key; render(); };
    tabs.appendChild(b);
  });
  root.appendChild(tabs);

  if(state.tab === "lernen") renderLernen(root, lesson);
  else if(state.tab === "karten") renderFlashcards(root, lesson);
  else if(state.tab === "zuordnen") renderMatch(root, lesson);
  else if(state.tab === "quiz") renderQuiz(root, lesson);
}

function renderLernen(root, lesson){
  const introCard = document.createElement("div");
  introCard.className = "card";
  introCard.innerHTML = `<p style="font-style:italic;">${lesson.intro}</p>`;
  root.appendChild(introCard);

  lesson.sections.forEach(sec=>{
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<h4>${sec.heading}</h4>${sec.html}`;
    root.appendChild(c);
  });
}

/* ---------- Flashcards ---------- */
let flashIndex = 0;
let flashFlipped = false;

function renderFlashcards(root, lesson){
  if(state._flashLesson !== lesson.id){ flashIndex = 0; flashFlipped = false; state._flashLesson = lesson.id; }
  const cards = lesson.flashcards;
  const card = cards[flashIndex];

  const wrap = document.createElement("div");
  wrap.className = "flash-wrap";
  wrap.innerHTML = `
    <div class="flash ${flashFlipped ? 'flipped' : ''}">
      <div class="flash-face flash-front">${card.front}</div>
      <div class="flash-face flash-back">${card.back}</div>
    </div>
  `;
  wrap.querySelector(".flash").onclick = () => { flashFlipped = !flashFlipped; render(); };
  root.appendChild(wrap);

  const hint = document.createElement("div");
  hint.className = "flash-hint";
  hint.textContent = "Antippen zum Umdrehen";
  root.appendChild(hint);

  const nav = document.createElement("div");
  nav.className = "flash-nav";
  nav.innerHTML = `
    <button data-dir="-1">‹ Zurück</button>
    <span class="flash-count">${flashIndex+1} / ${cards.length}</span>
    <button data-dir="1">Weiter ›</button>
  `;
  nav.querySelectorAll("button").forEach(b=>{
    b.onclick = () => {
      const dir = parseInt(b.dataset.dir);
      flashIndex = (flashIndex + dir + cards.length) % cards.length;
      flashFlipped = false;
      render();
    };
  });
  root.appendChild(nav);
}

/* ---------- Match game ---------- */
let matchState = null;

function renderMatch(root, lesson){
  if(!matchState || state._matchLesson !== lesson.id){
    state._matchLesson = lesson.id;
    matchState = {
      leftSel: null,
      solved: new Set(),
      rightOrder: shuffle(lesson.match.right.map((r,i)=>i)),
      wrongFlash: null
    };
  }
  const m = lesson.match;

  const info = document.createElement("div");
  info.className = "card";
  info.innerHTML = `<p>${m.instruction}</p><div class="match-status" id="matchStatus">${matchState.solved.size} / ${m.left.length} richtig zugeordnet</div>`;
  root.appendChild(info);

  const cols = document.createElement("div");
  cols.className = "match-cols";

  const leftCol = document.createElement("div");
  leftCol.className = "match-col";
  m.left.forEach((item)=>{
    const el = document.createElement("div");
    let cls = "match-item";
    if(matchState.solved.has(item.id)) cls += " correct";
    else if(matchState.leftSel === item.id) cls += " selected";
    el.className = cls;
    el.textContent = item.label;
    if(!matchState.solved.has(item.id)){
      el.onclick = () => { matchState.leftSel = item.id; render(); };
    }
    leftCol.appendChild(el);
  });

  const rightCol = document.createElement("div");
  rightCol.className = "match-col";
  matchState.rightOrder.map(i=>m.right[i]).forEach((item)=>{
    const el = document.createElement("div");
    let cls = "match-item";
    if(matchState.solved.has(item.id)) cls += " correct";
    el.className = cls;
    el.textContent = item.label;
    if(!matchState.solved.has(item.id)){
      el.onclick = () => {
        if(!matchState.leftSel) return;
        if(matchState.leftSel === item.id){
          matchState.solved.add(item.id);
          matchState.leftSel = null;
        } else {
          el.classList.add("wrong");
          matchState.leftSel = null;
        }
        render();
      };
    }
    rightCol.appendChild(el);
  });

  cols.appendChild(leftCol);
  cols.appendChild(rightCol);
  root.appendChild(cols);

  if(matchState.solved.size === m.left.length){
    const done = document.createElement("div");
    done.className = "card";
    done.innerHTML = `<p style="text-align:center;color:var(--good);font-weight:bold;">🎉 Alles richtig zugeordnet!</p>`;
    root.appendChild(done);
  }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ---------- Quiz ---------- */
let quizState = null;

function renderQuiz(root, lesson){
  if(!quizState || state._quizLesson !== lesson.id){
    state._quizLesson = lesson.id;
    quizState = { i: 0, score: 0, answered: false, selected: null };
  }

  if(quizState.i >= lesson.quiz.length){
    const total = lesson.quiz.length;
    setLessonResult(lesson.id, quizState.score, total);
    // Lernprotokoll (Bericht an die Eltern): je Quiz-Durchgang genau einmal, auch wenn neu gezeichnet wird
    if(window.LERNWERK && !quizState.protokolliert){
      quizState.protokolliert = true;
      const aufgaben = {};
      lesson.quiz.forEach((q, n) => {
        const ok = (quizState.antworten || [])[n];
        if(ok === undefined) return;
        aufgaben["f" + n] = { l: q.q.slice(0, 80), r: ok ? 1 : 0, f: ok ? 0 : 1 };
      });
      LERNWERK.protokolliere({ fach: "geschichte", fachTitel: "Geschichte", thema: lesson.id, titel: lesson.title, richtig: quizState.score, gesamt: total, geschafft: quizState.score / total >= 0.5, aufgaben });
    }
    const card = document.createElement("div");
    card.className = "card quiz-result";
    const ratio = quizState.score/total;
    const msg = ratio >= 0.8 ? "Stark! Das sitzt schon richtig gut." :
                ratio >= 0.5 ? "Gut gemacht — ein bisschen üben, dann sitzt es sicher." :
                "Kein Problem — schau dir „Lernen“ und „Karteikarten“ nochmal an und versuch es erneut.";
    card.innerHTML = `
      <div class="score">${quizState.score} / ${total}</div>
      <div class="msg">${msg}</div>
      <button class="restart-btn">Nochmal versuchen</button>
    `;
    card.querySelector(".restart-btn").onclick = () => {
      quizState = { i: 0, score: 0, answered: false, selected: null };
      render();
    };
    root.appendChild(card);
    return;
  }

  const q = lesson.quiz[quizState.i];
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="q-progress">Frage ${quizState.i+1} von ${lesson.quiz.length} · Punkte: ${quizState.score}</div>
    <div class="q-text">${q.q}</div>
  `;

  q.options.forEach((opt, idx)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = opt;
    if(quizState.answered){
      if(idx === q.correct) b.classList.add("correct");
      else if(idx === quizState.selected) b.classList.add("wrong");
      b.disabled = true;
    }
    b.onclick = () => {
      if(quizState.answered) return;
      quizState.answered = true;
      quizState.selected = idx;
      if(idx === q.correct) quizState.score++;
      (quizState.antworten = quizState.antworten || [])[quizState.i] = idx === q.correct;
      render();
    };
    card.appendChild(b);
  });

  if(quizState.answered){
    const fb = document.createElement("div");
    const isCorrect = quizState.selected === q.correct;
    fb.className = "feedback " + (isCorrect ? "good" : "bad");
    fb.textContent = (isCorrect ? "Richtig! " : "Nicht ganz. ") + q.why;
    card.appendChild(fb);

    const next = document.createElement("button");
    next.className = "next-btn";
    next.textContent = quizState.i+1 < lesson.quiz.length ? "Nächste Frage ›" : "Ergebnis anzeigen ›";
    next.onclick = () => {
      quizState.i++;
      quizState.answered = false;
      quizState.selected = null;
      render();
    };
    card.appendChild(next);
  }

  root.appendChild(card);
}

render();
</script>
<style>
.update-banner{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;max-width:456px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:52px;border:1px solid #C9A84C;border-radius:14px;background:#002B36;color:#F5F0E6;font:600 15px/1.3 Inter,system-ui,sans-serif;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:pointer;animation:ub-rein .25s ease-out}
.update-banner[hidden]{display:none}.update-banner:disabled{opacity:.7}
.update-banner .ub-text{flex:1;min-width:0}
.update-banner .ub-aktion{flex-shrink:0;padding:6px 12px;border-radius:999px;background:linear-gradient(135deg,#B8922A,#E8C97D);color:#000;font-weight:700}
@keyframes ub-rein{from{transform:translateY(140%);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.update-banner{animation:none}}
</style>
<button id="update-banner" class="update-banner" type="button" hidden><span aria-hidden="true">⬆️</span><span class="ub-text">Neue Inhalte verfügbar</span><span class="ub-aktion">Aktualisieren</span></button>
<script>
(function () {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  var banner = document.getElementById('update-banner');
  function zeigen() { banner.hidden = false; }
  // erst neu laden, wenn die neue Version übernommen hat – ein Neuladen mitten im Wechsel kann hängen bleiben
  var neuLaden = function () { neuLaden = function () {}; location.reload(); };
  banner.addEventListener('click', function () {
    banner.disabled = true;
    banner.querySelector('.ub-aktion').textContent = '…';
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg || !reg.waiting) return neuLaden();
      navigator.serviceWorker.addEventListener('controllerchange', function () { neuLaden(); });
      setTimeout(function () { neuLaden(); }, 3000);
      reg.waiting.postMessage('SKIP_WAITING');
    }).catch(function () { neuLaden(); });
  });
  navigator.serviceWorker.register('../sw.js', { scope: '../' }).then(function (reg) {
    // beim allerersten Besuch (noch kein Controller) gibt es nichts zu aktualisieren
    var hatteController = !!navigator.serviceWorker.controller;
    if (reg.waiting && hatteController) zeigen();
    reg.addEventListener('updatefound', function () {
      var neu = reg.installing;
      if (neu) neu.addEventListener('statechange', function () { if (neu.state === 'installed' && hatteController) zeigen(); });
    });
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (hatteController) zeigen(); });
    reg.update().catch(function () {});
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
    // Startseite: Version anzeigen und von Hand nach Updates suchen
    var v = document.getElementById('version');
    if (!v) return;
    var text = v.querySelector('span'), knopf = v.querySelector('button');
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data && e.data.version) text.textContent = 'Version ' + String(e.data.version).replace('lernwerk-', '').slice(0, 7);
    });
    if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('VERSION');
    knopf.hidden = false;
    knopf.addEventListener('click', function () {
      knopf.disabled = true; knopf.textContent = 'Suche …';
      reg.update().then(function () {
        var laedt = reg.installing || reg.waiting;
        if (reg.waiting) zeigen();
        knopf.textContent = laedt ? (reg.waiting ? 'Update bereit – unten tippen' : 'Update wird geladen …') : '✓ Neueste Version';
        if (reg.installing) reg.installing.addEventListener('statechange', function () { if (reg.waiting) knopf.textContent = 'Update bereit – unten tippen'; });
      }).catch(function () { knopf.textContent = 'Kein Internet – später noch mal'; })
        .then(function () { setTimeout(function () { knopf.disabled = false; }, 1500); });
    });
  }).catch(function () {});
})();
</script></body>
