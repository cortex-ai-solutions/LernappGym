  - id: ka-rest-deuten
    typ: freitext
    frage: "143 Kinder fahren ins Schullandheim. In einen Bus passen 30 Kinder. Paul rechnet 143 : 30 = 4 Rest 23 und sagt: „4 Busse reichen.“ Hat Paul recht? Begründe."
    optionen:
      - "Nein. 23 Kinder bleiben übrig, für sie braucht man noch einen Bus. Es sind 5 Busse nötig."
      - "Ja. Der Rest wird beim Teilen immer weggelassen."
      - "Nein. Man braucht 6 Busse, weil man immer zwei Busse dazunimmt."
      - "Ja. 4 Busse mit je 30 Kindern sind 143 Kinder."
    loesung: "Nein. 23 Kinder bleiben übrig, für sie braucht man noch einen Bus. Es sind 5 Busse nötig."
    erwartung: "Paul hat nicht recht. In 4 Busse passen nur 4 · 30 = 120 Kinder. Die übrigen 23 Kinder brauchen einen weiteren Bus, also sind 5 Busse nötig."
    be: 2
    schwierigkeit: 3
    afb: 3
