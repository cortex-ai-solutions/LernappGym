erklaerung: |
  **Stellenwerte hinter dem Komma**

  | Z | E | , | z | h | t |
  |---|---|---|---|---|---|
  | 2 | 3 | , | 4 | 5 | 7 |

  z = Zehntel, h = Hundertstel, t = Tausendstel. 23,457 hat 4 Zehntel, 5 Hundertstel und 7 Tausendstel.

  **Komma verschieben**
  - **· 10, · 100, · 1 000:** Komma um 1, 2, 3 Stellen nach **rechts**. 3,45 · 100 = **345**
  - **: 10, : 100, : 1 000:** Komma um 1, 2, 3 Stellen nach **links**. 4,5 : 100 = **0,045**
  - Fehlende Stellen mit **Nullen** auffüllen: 0,8 · 100 = **80**

  **Plus und minus:** Komma unter Komma schreiben, Endnullen ergänzen: 4,50 + 2,37 = **6,87**

  **Mal eine einstellige Zahl:** ohne Komma rechnen, dann bekommt das Ergebnis gleich viele Stellen hinter dem Komma: 2,35 · 4 → 235 · 4 = 940 → **9,40** = 9,4

  **Geteilt durch eine einstellige Zahl:** Das Komma im Ergebnis setzt du, sobald du beim Teilen über das Komma kommst: 9,6 : 3 = **3,2**

  **Vergleichen:** Stelle für Stelle von links. 3,5 > 3,45, denn 5 Zehntel sind mehr als 4 Zehntel. Endnullen ändern nichts: 2,1 = 2,10.
wissenswertes:
  - "In England und den USA schreibt man einen Punkt statt eines Kommas: 3.5 statt 3,5."
  - "Preise sind Kommazahlen: 2,49 € sind 2 Euro und 49 Cent."
