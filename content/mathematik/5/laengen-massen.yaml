fach: mathematik
klasse: 5
thema: laengen-massen
titel: "Längen und Massen umrechnen"
icon: "📏"
reihenfolge: 6
lehrplanbezug:
  - "2.1.3 Größen: Größenangaben ineinander umwandeln"
  - "2.1.3 Größen: mit Größenangaben rechnen und Einheiten sinnvoll verwenden"
verifiziert: true
quelle: "Lehrplan Mathematik Gymnasium Thüringen 2026 (Erprobungsfassung), Kap. 2.1.3 – siehe curriculum/mathematik.yaml"
erklaerung: |
  **Umrechnungszahlen**

  | Länge | Masse |
  |---|---|
  | 1 cm = 10 mm | 1 g = 1 000 mg |
  | 1 dm = 10 cm | 1 kg = 1 000 g |
  | 1 m = 10 dm = 100 cm | 1 t = 1 000 kg |
  | 1 km = 1 000 m | |

  - **In die kleinere Einheit:** mal die Umrechnungszahl. 3 kg = 3 · 1 000 g = **3 000 g**
  - **In die größere Einheit:** durch die Umrechnungszahl. 4 500 g = 4 500 : 1 000 kg = **4,5 kg**

  **Kommaschreibweise:** 3,25 m = 3 m 25 cm = **325 cm**. Bei kg/g und km/m gehören **drei** Stellen hinter das Komma: 2 kg 50 g = 2,050 kg = **2,05 kg**.
wissenswertes:
  - "Ein Blatt Papier ist ungefähr 0,1 mm dick. 10 Blätter zusammen sind also etwa 1 mm dick."
  - "Ein Blauwal kann mehr als 100 t wiegen – so viel wie rund 20 Elefanten."
