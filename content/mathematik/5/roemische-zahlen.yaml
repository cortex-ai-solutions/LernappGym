erklaerung: |
  **Die 7 römischen Zeichen**

  | I | V | X | L | C | D | M |
  |---|---|---|---|---|---|---|
  | 1 | 5 | 10 | 50 | 100 | 500 | 1000 |

  **Regel 1 – addieren:** Steht ein kleineres Zeichen **hinter** einem größeren, wird es **addiert**.
  VI = 5 + 1 = **6** · LX = 50 + 10 = **60** · MDC = 1000 + 500 + 100 = **1600**

  **Regel 2 – höchstens dreimal:** I, X, C und M stehen höchstens dreimal hintereinander. V, L und D stehen nie doppelt.
  III = 3, aber 4 ist **nicht** IIII.

  **Regel 3 – abziehen:** Steht ein kleineres Zeichen **vor** einem größeren, wird es **abgezogen**. Das gibt es nur 6-mal:
  IV = 4 · IX = 9 · XL = 40 · XC = 90 · CD = 400 · CM = 900

  **So schreibst du eine Zahl römisch:** Zerlege sie in Tausender, Hunderter, Zehner und Einer.
  1984 = 1000 + 900 + 80 + 4 = M + CM + LXXX + IV = **MCMLXXXIV**

  **Achtung:** 49 ist **nicht** IL, sondern 40 + 9 = XL + IX = **XLIX**.
wissenswertes:
  - "Die Römer kannten keine Null. Ein Zeichen für die Null brauchten sie nicht, weil ihre Zeichen nicht von der Stelle abhängen."
  - "Die alten Römer haben oft IIII statt IV geschrieben. Auf vielen Uhren steht die 4 bis heute als IIII."
  - "Zum Rechnen benutzten die Römer ein Rechenbrett mit Steinchen, den Abakus. Das lateinische Wort calculus heißt Steinchen. Daher kommt unser Wort kalkulieren."
  - "Römische Zahlen siehst du heute noch: bei Königen wie Ludwig XIV., bei Kapiteln in Büchern, an alten Häusern und bei Jahreszahlen im Abspann von Filmen."
