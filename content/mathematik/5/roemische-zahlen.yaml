  - id: ka-zehnersystem
    typ: freitext
    frage: "Vergleiche die römischen Zahlen mit unserem Zehnersystem. Nenne zwei Unterschiede."
    optionen:
      - "Im Zehnersystem hängt der Wert einer Ziffer von ihrer Stelle ab, römische Zeichen haben immer denselben Wert. Außerdem gibt es römisch keine Null."
      - "Römische Zahlen sind immer kürzer als Zahlen im Zehnersystem."
      - "Im Zehnersystem gibt es nur sieben Ziffern, römisch gibt es zehn Zeichen."
      - "Es gibt keinen Unterschied, nur die Zeichen sehen anders aus."
    loesung: "Im Zehnersystem hängt der Wert einer Ziffer von ihrer Stelle ab, römische Zeichen haben immer denselben Wert. Außerdem gibt es römisch keine Null."
    erwartung: "Zwei Unterschiede, z. B.: Das Zehnersystem ist ein Stellenwertsystem (in 333 ist jede 3 etwas anderes wert: 300, 30, 3), römische Zeichen haben einen festen Wert, der addiert oder abgezogen wird. Das Zehnersystem hat eine Null, das römische nicht. Römische Zahlen werden oft sehr lang (388 = CCCLXXXVIII). Das Zehnersystem kommt mit 10 Ziffern für alle Zahlen aus."
    be: 2
    schwierigkeit: 3
    afb: 3
  - id: ka-laenge
    typ: freitext
    frage: "Lisa sagt: „Je mehr Zeichen eine römische Zahl hat, desto größer ist sie.“ Hat Lisa recht? Begründe mit einem Beispiel."
    optionen:
