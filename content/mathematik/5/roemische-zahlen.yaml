      - "Ja, denn jedes Zeichen macht die Zahl größer."
      - "Ja, aber nur bei Zahlen über 100."
      - "Nein, denn römische Zahlen haben immer gleich viele Zeichen."
    loesung: "Nein. XXXVIII (38) hat sieben Zeichen, XL (40) nur zwei – und 40 ist größer."
    erwartung: "Lisa hat nicht recht. Beispiel: XXXVIII = 38 hat sieben Zeichen, XL = 40 hat nur zwei Zeichen, ist aber größer. Es kommt auf den Wert der Zeichen an, nicht auf ihre Anzahl."
    be: 2
    schwierigkeit: 3
    afb: 3
