    typ: multiple_choice
    frage: "Du rundest auf Hunderter. Auf welche Ziffer musst du schauen?"
    optionen: ["Einerziffer", "Zehnerziffer", "Hunderterziffer", "Tausenderziffer"]
    loesung: "Zehnerziffer"
    be: 1
    schwierigkeit: 1
    prioritaet: 2
  - id: halb-aufrunden
    typ: richtig_falsch
    frage: "4 500 auf Tausender gerundet ergibt 5 000."
