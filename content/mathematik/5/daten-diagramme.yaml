quelle: "Lehrplan Mathematik Gymnasium Thüringen 2026 (Erprobungsfassung), Kap. 2.1.1, S. 15–16 – siehe curriculum/mathematik.yaml"
erklaerung: |
  **Strichliste:** Jeder Strich ist eine Nennung. Der 5. Strich wird quer durch die ersten vier gezogen – so zählst du schnell in Fünferpäckchen.

  **Säulendiagramm:** Die Säulen stehen **senkrecht** nebeneinander.
  **Balkendiagramm:** Die Balken liegen **waagerecht** übereinander.

  So zeichnest du ein Diagramm:
  1. Achsen mit dem Lineal zeichnen
  2. Achsen beschriften und gleichmäßig einteilen (z. B. 1 Kästchen = 1 Nennung)
  3. Säulen/Balken gleich breit und mit Abstand zeichnen
  4. Überschrift nicht vergessen!
wissenswertes:
  - "Diagramme helfen, viele Zahlen auf einen Blick zu vergleichen. Zeitungen und Nachrichten benutzen sie ständig."
