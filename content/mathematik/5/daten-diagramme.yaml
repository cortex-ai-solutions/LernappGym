  - id: ka-irrefuehrend
    typ: freitext
    frage: "Zwei Klassen haben Kastanien gesammelt: die 5a 42 kg, die 5b 48 kg. In einem Säulendiagramm beginnt die Achse erst bei 40 kg. Dadurch ist die Säule der 5b viermal so hoch wie die der 5a. Was ist an diesem Diagramm irreführend?"
    optionen:
      - "Die Achse beginnt nicht bei 0. So sieht der Unterschied viel größer aus, als er ist: 48 kg sind nicht viermal so viel wie 42 kg."
      - "Nichts, die 5b hat wirklich viermal so viel gesammelt."
      - "Die Säulen müssten waagerecht liegen."
      - "Die Säule der 5a müsste höher sein als die der 5b."
    loesung: "Die Achse beginnt nicht bei 0. So sieht der Unterschied viel größer aus, als er ist: 48 kg sind nicht viermal so viel wie 42 kg."
    erwartung: "Die Achse beginnt bei 40 kg statt bei 0. Die 5a hat nur 6 kg weniger gesammelt (48 − 42 = 6), die Säulen täuschen aber einen viermal so großen Wert vor. Richtig wäre eine Achse ab 0."
    be: 2
    schwierigkeit: 3
    afb: 3
