    typ: multiple_choice
    frage: "Wie heißt das Ergebnis einer Multiplikation?"
    optionen: ["Summe", "Differenz", "Produkt", "Quotient"]
    loesung: "Produkt"
    be: 1
    schwierigkeit: 1
    prioritaet: 3
  - id: begriff-quotient
    typ: multiple_choice
    frage: "Wie heißt das Ergebnis einer Division?"
