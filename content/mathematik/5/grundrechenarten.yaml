  - "2.1.2 Natürliche Zahlen: Grundrechenoperationen im Kopf und schriftlich ausführen"
  - "2.1.2 Natürliche Zahlen: Zusammenhang zwischen Rechenoperation und Umkehroperation erläutern"
  - "2.1.2 Natürliche Zahlen: einfache Gleichungen durch inhaltliche Überlegungen lösen"
