fach: mathematik
klasse: 5
thema: grundrechenarten
titel: "Rechnen mit natürlichen Zahlen"
icon: "➗"
reihenfolge: 3
lehrplanbezug:
  - "2.1.2 Natürliche Zahlen: Grundrechenoperationen im Kopf und schriftlich ausführen"
  - "2.1.2 Natürliche Zahlen: Zusammenhang zwischen Rechenoperation und Umkehroperation erläutern"
  - "2.1.2 Natürliche Zahlen: einfache Gleichungen durch inhaltliche Überlegungen lösen"
verifiziert: true
quelle: "Lehrplan Mathematik Gymnasium Thüringen 2026 (Erprobungsfassung), Kap. 2.1.2, S. 16–17 – siehe curriculum/mathematik.yaml"
erklaerung: |
  **Die Fachbegriffe**

  | Rechnung | Teile | Ergebnis |
  |---|---|---|
  | 13 + 5 = 18 | Summand + Summand | **Summe** |
  | 20 − 6 = 14 | Minuend − Subtrahend | **Differenz** |
  | 4 · 7 = 28 | Faktor · Faktor | **Produkt** |
  | 36 : 4 = 9 | Dividend : Divisor | **Quotient** |

  **Kästchen-Trick:** Rechne mit der Umkehraufgabe. 47 − ∎ = 23 → 47 − 23 = 24, also ∎ = 24. Probe: 47 − 24 = 23 ✓
wissenswertes:
  - "Durch 0 kann man nicht teilen – das ist in der Mathematik verboten!"
  - "Jede Zahl mal 1 bleibt sie selbst. Jede Zahl mal 0 ergibt 0."
aufgaben:
