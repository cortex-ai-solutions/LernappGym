fach: mathematik
klasse: 5
thema: zeit
titel: "Zeit umrechnen"
icon: "⏱️"
reihenfolge: 7
lehrplanbezug:
  - "2.1.3 Größen: Größenangaben ineinander umwandeln"
  - "2.1.3 Größen: mit Größenangaben rechnen und Einheiten sinnvoll verwenden"
verifiziert: true
quelle: "Lehrplan Mathematik Gymnasium Thüringen 2026 (Erprobungsfassung), Kap. 2.1.3 – siehe curriculum/mathematik.yaml"
erklaerung: |
  **Umrechnungszahlen**

  - 1 min = 60 s · 1 h = 60 min
  - 1 d = 24 h · 1 h = 3 600 s

  **Achtung:** Bei der Zeit ist die Umrechnungszahl **60** (oder 24), nicht 10, 100 oder 1 000!

  - 2 h 15 min = 120 min + 15 min = **135 min**
  - 150 min = 120 min + 30 min = **2 h 30 min**

  **Zeitspannen** rechnest du am besten über die volle Stunde: 14:35 Uhr → 15:00 Uhr (25 min) → 16:00 Uhr (60 min) → 16:10 Uhr (10 min), zusammen **95 min**.
wissenswertes:
  - "Ein Tag hat 86 400 Sekunden."
  - "Dass eine Stunde 60 Minuten hat, geht auf die Babylonier zurück. Sie haben vor über 4 000 Jahren gern mit der Zahl 60 gerechnet."
aufgaben:
  - id: umrechnungszahlen
    typ: zuordnung
    frage: "Ordne richtig zu."
    paare: [["1 min", "60 s"], ["1 h", "60 min"], ["1 d", "24 h"], ["eine halbe Stunde", "30 min"], ["eine Viertelstunde", "15 min"]]
    be: 2
    schwierigkeit: 1
    prioritaet: 2
  - id: zeit-ganz
    typ: rechnung
    generator: umrechnen
    parameter: { groesse: zeit, modus: ganz }
    anzahl: 4
    be: 1
    schwierigkeit: 1
    prioritaet: 1
  - id: sekunden-stunde
    typ: multiple_choice
    frage: "Wie viele Sekunden hat eine Stunde?"
    optionen: ["60", "360", "3 600", "6 000"]
    loesung: "3 600"
    be: 1
    schwierigkeit: 2
    prioritaet: 3
  - id: gemischt
    typ: rechnung
    generator: umrechnen
